# parking_lot_core 0.9.12, patched by Pulsar: its process-wide state (the parked-thread
# hash table and the thread count) sits behind a pointer a host can hand to a
# plugin library, so a thread the library parks is found by the host's unlock
# (see `attach` in src/parking_lot.rs). Everything else is upstream's.
[package]
publish = false
edition = "2021"
rust-version = "1.71.0"
name = "parking_lot_core"
version = "0.9.12"
authors = ["Amanieu d'Antras <amanieu@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An advanced API for creating custom synchronization primitives."
readme = false
keywords = [
    "mutex",
    "condvar",
    "rwlock",
    "once",
    "thread",
]
categories = ["concurrency"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Amanieu/parking_lot"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[features]
deadlock_detection = [
    "petgraph",
    "backtrace",
]
nightly = []

[lib]
name = "parking_lot_core"
path = "src/lib.rs"

[dependencies.backtrace]
version = "0.3.60"
optional = true

[dependencies.cfg-if]
version = "1.0.0"

[dependencies.petgraph]
version = "0.6.0"
optional = true

[dependencies.smallvec]
version = "1.6.1"

[target.'cfg(target_os = "redox")'.dependencies.redox_syscall]
version = "0.5"

[target."cfg(unix)".dependencies.libc]
version = "0.2.95"

[target."cfg(windows)".dependencies.windows-link]
version = "0.2.0"
