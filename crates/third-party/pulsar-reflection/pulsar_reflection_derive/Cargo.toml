[package]
name = "pulsar_reflection_derive"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["proc-macro"] }
owo-colors = "4"
pulsar_reflection_codegen = { path = "../pulsar_reflection_codegen" }
