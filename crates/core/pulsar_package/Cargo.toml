[package]
name = "pulsar_package"
version = "0.1.0"
edition = "2021"
description = "Packages a Pulsar project as a standalone game (Pulsar-Native#926): compiles every script class headlessly, cooks levels and prefabs (class GUIDs resolved, editor-only data dropped, asset paths made content-relative), collects the assets they use, writes Content/game.pak with an asset registry, and builds the game binary. The `pulsar` CLI (`pulsar package`, `pulsar build-scripts`)."

[[bin]]
name = "pulsar"
path = "src/main.rs"

[features]
# Compile every class headlessly in `pulsar package` / `pulsar build-scripts`
# (ScriptLanguage::compile_project, #879): each language is a plugin (Blueprints,
# TypeScript) that registers itself (`pulsar_language::Language`). Without it,
# classes must already have compiled modules (the editor writes them on save);
# they are still verified and linked.
#
# `link-plugins` links every installed plugin into this crate's executable, which
# loads no libraries: the `pulsar` CLI needs it for the languages and each
# plugin's record migrations. The editor builds this crate without it, because it
# loads the plugins it needs from their libraries (tools/plugin_builder).
default = ["scripting", "link-plugins"]
scripting = []
link-plugins = ["dep:installed_plugins", "installed_plugins/editor"]

[dependencies]
pulsar_content = { workspace = true }
engine_fs = { workspace = true }
# Every installed plugin's root crate (feature `link-plugins`): the cook runs their record
# migrations (`pulsar_class::records`), as the editor's load does. A level cooked without
# them keeps what a plugin's migration drops. This crate is a host (architecture/layers.toml):
# it reaches plugins only through the installed set.
installed_plugins = { workspace = true, optional = true }
pulsar_class = { workspace = true }
# The languages linked into this tool: compilers, class markers (messages).
pulsar_language = { workspace = true }
pulsar_script_vm = { workspace = true }
pulsar_script_runtime = { workspace = true }
# The engine's full native registry and event hub: modules are linked
# against exactly what the game will run.
pulsar_game = { workspace = true }
pulsar_events = { workspace = true }
engine_state = { workspace = true }
# The project's plugin set (`activate_project`), so the plugin folders it snapshots are the game's.
pulsar_plugins = { workspace = true }
pulsar_settings = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
plugin_editor_api = { workspace = true }
pulsar_world_registry.workspace = true
engine_backend = { workspace = true }
plugin_manager = { workspace = true }

[dev-dependencies]
helio_component = { workspace = true }
# The packaged-game test (`tests/packaged_physics.rs`) watches the threads and the clock.
editor_task_queue = { workspace = true }
pulsar_core = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
