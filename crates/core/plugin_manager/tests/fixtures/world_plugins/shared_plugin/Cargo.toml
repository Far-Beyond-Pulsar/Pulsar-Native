# A plugin library for plugin_manager's world-component tests (#1081),
# built by those tests. shared plugin: links the engine's world crates through pulsar_world_dylib, as a plugin should
[package]
name = "world_shared_plugin"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
engine_class_derive   = { workspace = true }
pulsar_reflection     = { workspace = true }
pulsar_scenedb        = { workspace = true }
pulsar_world_registry = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
tracing               = { workspace = true }
pulsar_world_dylib = { path = "../../../../../pulsar_world_dylib" }
