[package]
edition = "2021"
name = "engine_backend"
description = "A modern high-performance game engine backend written in Rust"
publish = false
version = "0.1.34"

[dev-dependencies]
helio-scene-join = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
# Test-only -- blocks on wgpu's async adapter/device requests in the
# Transform GPU-mirror test (scene/world_store.rs), same pinned version
# `helio-component` already uses for the identical purpose.
pollster = "=0.4.0"
helio-core = { workspace = true }

[build-dependencies]
toml = { workspace = true }

[lints]
workspace = true

[dependencies]
# The plugin gate (registrations name their origin; `pulsar_plugins::registered`).
pulsar_plugins = { workspace = true }
# The sublevel actor row the engine's sublevel displays author (a scene
# row the meshes' api defines: `sublevels.rs`).
helio-mesh-api = { workspace = true }
helio-scene-join = { workspace = true, optional = true }
inventory = { workspace = true }
helio-core = { workspace = true, optional = true }
toml.workspace = true
# Physics bodies on the WaterSim channel derive the water simulation's
# hitbox source rows (Pulsar-Native#1080).
pulsar_physics.workspace = true
engine_subsystems = { workspace = true }
ui_gen_macros = { workspace = true }
pebble = { package = "PebbleVault", version = "0.7.0" }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["full"] }
rapier3d = { workspace = true, optional = true }
tracing = { workspace = true }
thiserror = { workspace = true }
pulsar_error = { path = "../pulsar_error" }
dashmap = { workspace = true }
bitflags = "2"

# Reflection system
pulsar_reflection.workspace = true
pulsar_events.workspace = true
engine_state.workspace = true
# Project settings: Helio's as registered (`project_settings`), virtual geometry.
pulsar_settings.workspace = true

# World/Entity storage (Phase B1, Pulsar-Native#553) -- the editor's live
# scene store is moving onto this instead of the hand-rolled SceneDb/
# SceneMetadataDb/ComponentDb in `src/scene/`. See `src/scene/world_store.rs`.
pulsar_scenedb.workspace = true
pulsar_scene_model = { workspace = true }
pulsar_class = { workspace = true }
pulsar_world_registry.workspace = true
# Script object model bridge (#639): StableIdResolver + ComponentInstanceStore impls.
pulsar_script_object_model.workspace = true

# Shared scene loading — canonical implementation used by both engine and game
pulsar_scene.workspace = true
helio_component.workspace = true
helio-mats = { workspace = true, optional = true }
helio-pass-postprocess = { workspace = true, optional = true }
engine_fs.workspace = true

# Profiling - instrumentation-based
profiling = { workspace = true }

# UI dependencies needed for services
gpui-ce = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
pulsar_lsp = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }
ropey = { workspace = true, optional = true }
flume = { workspace = true, optional = true }

# Helio rendering (wgpu-based)
helio = { workspace = true, optional = true }
helio-presets = { workspace = true, optional = true }
helio-scene-derivations = { workspace = true, optional = true }
helio-graph-asset = { workspace = true, optional = true }
# Blocks on wgpu's adapter/device requests for the render graph pin probe.
pollster = { version = "=0.4.0", optional = true }
# The features plugins add to the renderer (`RenderFeatureRegistration`).
helio-feature-api = { workspace = true, optional = true }
helio-pass-tsr = { workspace = true, optional = true }
# Opt-in live SceneDB inspector bridge; inert unless launched by scenedb_inspector.
scenedb-inspector-agent = { workspace = true, optional = true }
glam.workspace = true
bytemuck = { version = "1.14", optional = true }

wgpu = { workspace = true, optional = true }
# Play-In-Editor embedding: load a game project cdylib and drive it (issue #243)
pulsar_pie_abi = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
# horizon = { git = "https://github.com/Far-Beyond-Dev/Horizon", rev = "b11774f548d50e183b9a452369cda6877fc0abe4" }
serde_json = { workspace = true }
rust-embed = { workspace = true, features = ["interpolate-folder-path", "include-exclude"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"], optional = true }

# Networking dependencies
async-tungstenite = { version = "0.35", features = ["tokio-runtime"], optional = true }
git2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[features]
default = ["render", "editor-ui", "pie", "networking", "vcs", "physics"]
# Not a real dependency toggle -- exists solely so `#[cfg(feature = "gpu")]`
# embedded in `pulsar_scenedb_derive`'s generated code (`#[derive(SceneStore)]`
# on `Transform`, scene/world_store.rs) evaluates true. That `cfg` checks the
# DERIVING crate's own features, not `pulsar_scenedb`'s -- see `engine_class_
# derive`/`helio-scenedb`'s own `[features] gpu` for the identical gotcha,
# documented there first. Implied by `render` (GPU-column registration is
# meaningless without wgpu anyway), not standalone-selectable.
gpu        = []
render     = ["dep:scenedb-inspector-agent", "dep:helio", "dep:helio-core", "dep:helio-presets", "dep:helio-scene-derivations", "dep:helio-graph-asset", "dep:pollster", "dep:helio-pass-postprocess", "dep:helio-scene-join", "dep:wgpu", "dep:bytemuck", "gpu", "dep:helio-feature-api", "dep:helio-pass-tsr", "dep:helio-mats"]
editor-ui  = ["dep:gpui-ce", "dep:ui", "dep:pulsar_lsp", "dep:lsp-types", "dep:ropey", "dep:flume"]
pie        = ["dep:pulsar_pie_abi", "dep:libloading", "dep:crossbeam-channel", "dep:wgpu"]
networking = ["dep:reqwest", "dep:async-tungstenite", "dep:futures"]
vcs        = ["dep:git2", "dep:sha2", "dep:walkdir"]
physics    = ["dep:rapier3d"]
# Hot-reload `.wgsl` edits into the running renderer (Helio's
# `shader-hot-reload`). Helio enables it by default, so this only matters when
# helio is built with `default-features = false`. Set
# `HELIO_SHADER_HOT_RELOAD=0` to turn it off at runtime. The `?` keeps it from
# pulling in `helio` by itself.
shader-hot-reload = ["helio?/shader-hot-reload"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation"] }
winapi = { workspace = true, features = ["winuser"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
