[package]
name = "pulsar_world_registry"
version = "0.1.0"
edition = "2021"
description = "Class-name-keyed registry of reflection-typed components in pulsar_scenedb::World: factories, boundary decode, clone and erased insert/remove, reflected property and method dispatch, object feeds, change watches and component lifecycles."

[dependencies]
pulsar_scenedb    = { workspace = true }
pulsar_events     = { workspace = true }
pulsar_reflection = { workspace = true }
serde_json        = { workspace = true }
serde             = { workspace = true }
inventory         = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
# World components as script VM components and natives (`script_natives`).
pulsar_script_vm  = { workspace = true }
pulsar_script_math = { workspace = true }
pulsar_scene_model = { workspace = true }

[dev-dependencies]
pollster = "=1.0.1"
wgpu = { workspace = true }
glam = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true

[[bench]]
name = "script_tick"
harness = false
