[package]
name = "helio_component"
version = "0.1.0"
edition = "2024"

[features]
# `#[derive(SceneStore)]`'s generated GPU-column methods (`register_gpu_
# columns`/`register_gpu_columns_growable`/the world-mirror dispatch
# registration, ...) are wrapped in `#[cfg(feature = "gpu")]`. That `cfg`,
# spliced into THIS crate by `#[engine_class(scene_store, ...)]`'s macro
# expansion on `StaticMeshComponent` (Pulsar-Native#561 Phase D), checks
# THIS crate's own Cargo features -- not `pulsar_scenedb`'s (already on via
# the `features = ["gpu"]` on its root-workspace dependency spec) -- so a
# crate defining `scene_store` components needs its own feature of exactly
# this name too. On by default.
default = ["gpu"]
gpu = []

[dependencies]
# The plugin gate (registrations name their origin; `pulsar_plugins::registered`).
pulsar_plugins = { workspace = true }
engine_class_derive = { workspace = true }
# No `prims-gpui`: this crate is the kernel's and defines no GPUI code; its data
# types' inspector editors are ui_common's.
pulsar_reflection = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
# Ground-material names registered by the plugins whose ground has them.
inventory = { workspace = true }
pulsar_events = { workspace = true }
pulsar_scene_model = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
glam = { workspace = true, features = ["serde"] }
helio.workspace = true
helio-core.workspace = true
image.workspace = true
# BC7 encoder (Intel ISPC Texture Compressor, prebuilt kernels) for cooked
# textures; see src/cooked_texture.rs.
intel_tex_2 = "0.5"
wgpu.workspace = true
# The asset-kind vocabulary (GPUI-free; the editor SDK re-exports it).
ui_types_common = { workspace = true }
engine_state.workspace = true
engine_fs = { workspace = true }

[dev-dependencies]
pollster = "=0.4.0"
bytemuck = { workspace = true }
naga = { version = "30.0.0", features = ["wgsl-in"] }
tempfile = { workspace = true }

[lints]
workspace = true
