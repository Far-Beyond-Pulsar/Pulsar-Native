[package]
name = "helio_component"
version = "0.1.0"
edition = "2024"

[features]
# `#[derive(SceneStore)]`'s generated GPU-column methods (`register_gpu_
# columns`/`register_gpu_columns_growable`/the world-mirror dispatch
# registration, ...) are wrapped in `#[cfg(feature = "gpu")]`. That `cfg`,
# spliced into THIS crate by `#[engine_class(scene_store, ...)]`'s macro
# expansion on `StaticMeshComponent` (Pulsar-Native#561 Phase D), checks
# THIS crate's own Cargo features -- not `pulsar_scenedb`'s (already on via
# the `features = ["gpu"]` on its root-workspace dependency spec) -- so this
# crate needs its own feature of exactly this name too, same gotcha
# `helio-scenedb/Cargo.toml` documents for the identical situation. On by
# default: every `scene_store` component defined here wants its `#[gpu]`
# fields live, not opt-in per build.
default = ["gpu"]
gpu = []

[dependencies]
helio-mesh-api = { workspace = true }
helio-pass-post-volumes = { workspace = true }
engine_class_derive = { workspace = true }
# M3-alpha Task 2 (audit follow-up): `prims-gpui` is required here — this
# crate defines its own GPUI property editors (`render_mesh_asset_editor` in
# src/components/static_mesh_component.rs)
# via `#[pulsar_reflection::pulsar_type(editor = ...)]`, which needs
# `pulsar_reflection::PropertyEditorArgs`'s GPUI-typed fields and
# `erase_property_editor_fn_ptr`. `gpui-ce`/`ui` are already unconditional
# deps of this crate below, so this only affects `pulsar_reflection`'s own
# feature set, not this crate's dependency tree.
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
# Ground-material names registered by the plugins whose ground has them.
inventory = { workspace = true }
pulsar_events = { workspace = true }
pulsar_scene_model = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
glam = { workspace = true, features = ["serde"] }
helio.workspace = true
# `SceneDerivation`/`BufferKey` for the virtual-geometry instance derivation
# (src/virtual_geometry_instances.rs); `helio-vg-format` is the frozen GPU ABI.
helio-core.workspace = true
helio-vg-format.workspace = true
helio-vg-stream.workspace = true
helio-vg-build.workspace = true
helio-mats.workspace = true
# Shader-graph material slots compile at upload time (static_mesh_draw).
psgc.workspace = true
image.workspace = true
# BC7 encoder (Intel ISPC Texture Compressor, prebuilt kernels) for cooked
# textures; see src/cooked_texture.rs.
intel_tex_2 = "0.5"
helio-asset-compat = { workspace = true }
skeletal_assets.workspace = true
helio-pass-corona = { workspace = true }
helio-pass-decal = { workspace = true }
helio-pass-postprocess = { workspace = true }
helio-pass-lens = { workspace = true }
helio-pass-sky = { workspace = true }
helio-pass-sprite-batch = { workspace = true }
helio-pass-volumetric-fog = { workspace = true }
helio-pass-water-sim = { workspace = true }
helio-pass-foliage-place = { workspace = true }
thiserror.workspace = true
wgpu.workspace = true
gpui-ce.workspace = true
ui.workspace = true
ui_common.workspace = true
plugin_editor_api.workspace = true
engine_fs.workspace = true
engine_state.workspace = true
engine_subsystems.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
# Content-addressed asset identity (Pulsar-Native#632): xxh3-128 over decoded
# mesh bytes for PMSH v1 backfill / non-native source paths, and as the
# fallback path->id hash in `MeshAssetPath::content_id` (see mesh_cache.rs).
twox-hash = { workspace = true }

[dev-dependencies]
pollster = "=0.4.0"
naga = { version = "30.0.0", features = ["wgsl-in"] }
tempfile = { workspace = true }

[[test]]
name = "static_mesh_component_gpu_mirror"
required-features = ["gpu"]

[[test]]
name = "content_dedup"
required-features = ["gpu"]

[[test]]
name = "content_dedup_benchmarks"
required-features = ["gpu"]

[lints]
workspace = true
