[package]
name = "plugin_editor_api"
version = "0.1.0"
edition = "2021"

[dependencies]
# The plugin gate and the engine's file layer.
engine_fs = { workspace = true }
pulsar_plugins = { workspace = true }
# Registrations (`pub use inventory` for plugin authors).
inventory = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { version = "1", features = ["serde"] }
schemars = { workspace = true }
tracing = { workspace = true }
gpui-ce = { workspace = true, optional = true }
window_manager = { workspace = true, optional = true }
ui_types_common = { workspace = true }

# UI dependencies (for Panel trait integration)
ui = { workspace = true, optional = true }


# Reflection system (for EngineClass — plugin components use full reflection)
pulsar_reflection = { workspace = true }
# The engine-owned language server, handed to editors through `EditorServices`.
pulsar_lsp = { workspace = true, optional = true }
# Asset-update notifications (`asset_events`), shared with the engine.
pulsar_events = { workspace = true }
# The world crates' shared runtimes: plugin component classes become World
# components of the editor once the library is attached (#1083).
pulsar_world_registry = { workspace = true }
profiling = { workspace = true }
# Languages: the `Language` registration, its compiler trait and its server
# spec (defined there, re-exported here for plugin authors).
pulsar_language = { workspace = true }
# Headless script compiles (`ScriptLanguage::compile_project`) link against
# the engine's native registry.
pulsar_script_vm = { workspace = true }
gamma = { workspace = true }
[build-dependencies]
tracing = { workspace = true }

[dev-dependencies]
tracing = { workspace = true }
gpui-ce = { workspace = true, features = ["test-support"] }
[lib]
crate-type = ["lib", "cdylib"]

[[test]]
name = "editor_creation"
path = "tests/editor_creation.rs"
required-features = ["editor"]

[features]
default = []
# Runtime cooking and script compilation do not require the editor UI. Editor
# hosts opt into this feature for GPUI panels, editor services and commands.
editor = ["dep:gpui-ce", "dep:ui", "dep:window_manager", "dep:pulsar_lsp"]

[lints]
workspace = true
