[package]
name = "pulsar_scene_model"
version = "0.1.0"
edition = "2021"
description = "The engine's scene vocabulary: plain components (StableId, Name, Transform, Parent, ...) stored directly in pulsar_scenedb::World, plus stateless helpers for identity, hierarchy and selection derived from them."

[dependencies]
pulsar_scenedb = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `#[derive(SceneStore)]` output names `::wgpu` directly.
wgpu = { workspace = true }
# The derive output also names `::pulsar_reflection` (packed GPU views are Reflectable).
pulsar_reflection = { workspace = true }

[features]
# `pulsar_scenedb_derive` wraps its GPU-column output in `#[cfg(feature = "gpu")]`,
# which is evaluated against the crate that DERIVES (this one), not pulsar_scenedb.
default = ["gpu"]
gpu = []

[lints]
workspace = true
