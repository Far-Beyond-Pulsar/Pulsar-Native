[package]
name = "pulsar_game"
version = "0.1.0"
edition = "2021"
description = "Pulsar game runtime: archetypal ECS, tick loop, async task pool, and actor lifecycle"

[dependencies]
# Core primitives (extracted)
pulsar_core  = { workspace = true }
pulsar_scenedb   = { workspace = true }

# Play-In-Editor embedding ABI (host <-> embedded game dylib)
pulsar_pie_abi = { workspace = true }

# Profiling + logging
profiling   = { workspace = true }
tracing     = { workspace = true }

# Blueprint runtime dependencies
ui = { workspace = true }
pbgc = { workspace = true }
pulsar_bp_executor = { workspace = true }
pulsar_std_bundle = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

# Reflection — for ComponentStore property access
pulsar_reflection = { workspace = true }
pulsar_world_registry = { workspace = true }

# Windowed rendering (Helio + winit + wgpu)
helio   = { workspace = true }
helio-default-graphs = { workspace = true }
winit   = { workspace = true }
wgpu    = { workspace = true }
glam    = { workspace = true }
pollster = "1.0"
# Shared-world store locking (same crate engine_backend's RwLock<WorldSceneStore> uses)
parking_lot = { workspace = true }

# Scene loading + settings
pulsar_scene    = { workspace = true }
engine_state    = { workspace = true }
pulsar_settings = { workspace = true }

# One-world play-mode scene state (Pulsar-Native#637): RuntimeLevel hydration
# into WorldSceneStore/SceneDb plus the shared per-frame Helio rebuild bridge.
# Slim feature set on purpose -- a game runtime must not pull editor-ui/gpui,
# networking, or PIE-host machinery; `render` brings helio/wgpu (already direct
# deps above) for the GPU seam. Direct path dep because the workspace table
# doesn't allow members to opt out of default features.
engine_backend  = { path = "../engine_backend", default-features = false, features = ["render"] }

[lints]
workspace = true

[dev-dependencies]
# Drift guard (#652): the reference actor mirrors PBGC's emitted shape and
# must keep compiling against the pinned crates; tempfile serves the
# end-to-end generated-project cargo check (tests/generated_project_compiles).
engine_class_derive = { workspace = true }
tempfile = { workspace = true }
