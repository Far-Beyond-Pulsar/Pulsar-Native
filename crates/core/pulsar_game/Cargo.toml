[package]
name = "pulsar_game"
version = "0.1.0"
edition = "2021"
description = "Pulsar game runtime: archetypal ECS, tick loop, async task pool, and actor lifecycle"

[dependencies]
# Engine origins of the render runtimes it registers.
pulsar_plugins = { workspace = true }
editor_task_queue = { workspace = true }
# Core primitives (extracted)
pulsar_core  = { workspace = true }
pulsar_scenedb   = { workspace = true }

# Play-In-Editor embedding ABI (host <-> embedded game dylib)
pulsar_pie_abi = { workspace = true }

# Profiling + logging
profiling   = { workspace = true }
tracing     = { workspace = true }

# The engine script VM runtime (scripting.rs) and pulsar_std, whose
# functions it links as natives.
pulsar_script_runtime = { workspace = true }
pulsar_script_vm = { workspace = true }
inventory = { workspace = true }
pulsar_std = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

# Reflection — for ComponentStore property access
pulsar_reflection = { workspace = true }
pulsar_world_registry = { workspace = true }

# Script object model (#654): ActorRef/ComponentRef identity types behind the
# graph reference nodes' JSON shapes.
pulsar_script_object_model = { workspace = true }

# Windowed rendering (Helio + winit + wgpu)
helio   = { workspace = true }
winit   = { workspace = true }
wgpu    = { workspace = true }
glam    = { workspace = true }
pollster = "1.0"
# Shared-world store locking (same crate engine_backend's RwLock<SceneDb> uses)
parking_lot = { workspace = true }

# Scene loading + settings
pulsar_scene    = { workspace = true }
pulsar_class    = { workspace = true }
pulsar_events   = { workspace = true }
engine_state    = { workspace = true }
pulsar_settings = { workspace = true }
# Shipped content (#926): the content root (pak or loose files, found from
# the executable), project settings, and virtual_fs reads of class modules.
pulsar_content  = { workspace = true }
engine_fs       = { workspace = true }
# Traits and roles: the trait index, the role registry.
pulsar_traits   = { workspace = true }

# One-world play-mode scene state (Pulsar-Native#637): RuntimeLevel hydration
# into SceneDb plus the GPU mirror the renderer reads.
# Slim feature set on purpose -- a game runtime must not pull editor-ui/gpui,
# networking, or PIE-host machinery; `render` brings helio/wgpu (already direct
# deps above) for the GPU seam. Direct path dep because the workspace table
# doesn't allow members to opt out of default features.
engine_backend  = { path = "../engine_backend", default-features = false, features = ["render"] }

# Cameras, movability (`StaticMoveWatch`): the engine's shared pieces.
helio_component = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Every installed plugin's root crate: a few unit tests run the game with a
# plugin's component (a light's properties from scripts, the input plugin's
# possession), naming `installed_plugins::<module>`. The game's tests with
# every plugin (render parity, plugin pass lists, memory over ticks) are the
# installed set's own (`plugins/installed/tests`).
installed_plugins = { workspace = true }
# Drift guard (#652): the reference actor mirrors the exporter's emitted shape and
# must keep compiling against the pinned crates; tempfile serves the
# end-to-end generated-project cargo check (tests/generated_project_compiles).
engine_class_derive = { workspace = true }
tempfile = { workspace = true }
# Loads pulsar_events' separately compiled test plugin (script events from
# a plugin library, #924).
libloading = { workspace = true }
# The end-to-end generated-project check exports a class through the real generator.
pulsar_script_codegen = { workspace = true }

[build-dependencies]
# `build.rs` generates the export probe actor (src/export_probe.rs).
pulsar_script_codegen = { workspace = true }
pulsar_script_vm = { workspace = true }

[features]
# Sampling heap profiler used as the global allocator, for leak hunting.
# Off by default; see `alloc_profile`.
alloc-profile = []
