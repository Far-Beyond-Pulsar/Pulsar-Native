[package]
name = "pulsar_script_object_model"
version = "0.1.0"
edition = "2021"
description = "Script-facing object model: ActorRef/ComponentRef handles that address live SceneDB World state with per-access liveness validation, properties-panel-parity property routing, and typed never-panic errors."

[dependencies]
pulsar_scenedb        = { workspace = true }
pulsar_reflection     = { workspace = true }
pulsar_world_registry = { workspace = true }
serde                 = { workspace = true, features = ["derive"] }
serde_json            = { workspace = true }
thiserror             = { workspace = true }

[dev-dependencies]
# `#[derive(Serialize)]` on the test component class only.
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
