[package]
name = "engine_fs"
version = "0.1.0"
edition = "2021"

[features]
default = ["remote", "p2p"]
remote = ["dep:ureq", "dep:urlencoding", "dep:base64"]
p2p = ["dep:futures", "dep:pulsar-multiplayer-core"]

[dependencies]
# Mounted content and the index's registrations are origin-gated contributions.
pulsar_plugins = { workspace = true }
# The watcher publishes asset updates (`AssetChangeKind`).
pulsar_events = { workspace = true }
ui_types_common = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
notify = { workspace = true }
parking_lot = { workspace = true }
urlencoding = { workspace = true, optional = true }
ureq = { version = "3.0", features = ["json"], optional = true }
base64 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
futures = { workspace = true, optional = true }
pulsar-multiplayer-core = { path = "../pulsar-multiplayer-core", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = "=0.1.92"
tokio = { workspace = true, features = ["rt", "macros"] }
toml = { workspace = true }

[lints]
workspace = true
