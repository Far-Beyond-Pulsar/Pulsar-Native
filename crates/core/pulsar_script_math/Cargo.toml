[package]
name = "pulsar_script_math"
version = "0.1.0"
edition = "2021"
description = "glam math types (Vec2/Vec3/Vec4/DVec3/Quat/Mat4) as script value types, with constructor, field and arithmetic natives. Linked by the editor and packaged games, never by the VM itself."

