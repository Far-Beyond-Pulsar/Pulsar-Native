# ── GPU schemas ──────────────────────────────────────────────────────────
# Every linked #[derive(SceneStore)] type with #[gpu] fields. `registered`:
# production code registers its columns (unregistered writes are dropped).

[[schema]]
type = "LightSourceRow"
path = "helio_component::components::light_component::source_row::LightSourceRow"
buffers = ["light_sources"]
clears_on_remove = true
releases_var_len = false
registered = true
writer = "LightComponent's second GPU registration (to_helio_gpu_light of the authored value, enabled flag in the padding word), on every insert, write, removal and replay"
owner = "helio_component::components::light_component::source_row"
disposition = "keep: the scene join's light input (Phase 2)"
target_contract = "Phase 2; 03-gpu-reflection-and-rendering.md"
test = "crates/editor/ui_level_editor/tests/render_acceptance.rs"
status = "verified"

[[schema]]
