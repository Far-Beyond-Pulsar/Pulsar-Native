# ── Asset table (SceneDB#84) ────────────────────────────────────────────
# Asset kinds registered with SceneDB's asset table, the components they bind
# into, and the engine's reload and pump call sites. A component naming an
# asset by AssetId needs no caller-side loading: the world loads it off the
# write path, binds it into every dependent and reloads it when its source
# changes.







[[site]]
pattern = "asset-kind"
file = "crates/core/helio_component/src/texture_assets.rs"
count = 1
owner = "helio_component::texture_assets (register_texture_assets)"
disposition = "keep: the texture kind (sprite texture, decal albedo). Its loader reads and decodes the image on a SceneDB worker; a missing or corrupt file fails the asset and its components show the tint alone. A component's handle-ledger collector derives the AssetId from its path, so a typed insert, a decoded level, a reflected write and a script all reference it the same way; the GPU dispatch uploads the bound image and never reads the file"
target_contract = "SceneDB#84; 07-assets-and-runtime-lifecycle.md"
test = "plugins/vendor/sprites/tests/texture_assets.rs (texture_assets_load_rebind_reload_and_survive_bad_input), plugins/installed/tests/render_acceptance.rs (sprites_draw_in_2d_over_the_3d_scene)"
status = "verified"

[[site]]
pattern = "asset-reload"
file = "crates/core/engine_backend/src/scene/mod.rs"
count = 1
owner = "engine_backend::scene (reload_updated_asset, subscribe_asset_reloads)"
disposition = "keep: the one reload path. A mesh, texture or material AssetUpdated (the project watcher publishes one for a changed image, material document or shader-graph save) reloads that file's assets in a world, a texture also every graph material sampling it, which rebinds every dependent; a class (Blueprint) update rebuilds every placed instance of that class in the world from its new definition, keeping each instance's own edits, diffed against the definition the instance was built from, which pulsar_class::world records on its root however it was built (placement, level load, a script's spawn, a rebuild) and which goes with the instance (engine_backend::scene::classes); the editor's subscription and every game loop that builds its own world go through it, so a headless world reloads without the editor"
target_contract = "SceneDB#84; 07-assets-and-runtime-lifecycle.md"
test = "plugins/installed/tests/asset_reload.rs (a_game_world_reloads_a_reimported_mesh_without_the_editor), plugins/installed/tests/mesh_reimport.rs (a_reimported_mesh_reloads_every_mesh_naming_it), plugins/vendor/lights/tests/class_reload.rs (class_updates_rebuild_instances_in_worlds_without_the_editor), crates/core/pulsar_class/tests/instances.rs (every_build_path_records_the_definition_it_built_from)"
status = "verified"

[[site]]
pattern = "asset-pump"
file = "crates/core/engine_backend/src/scene/mod.rs"
count = 2
owner = "engine_backend::scene (resolve_level_assets, pump_assets)"
disposition = "keep: resolve_level_assets waits for a just-loaded level's assets before its first frame; pump_assets starts and binds loads once per frame from every render loop and at the end of every game tick, so headless runs bind too"
target_contract = "SceneDB#84; 07-assets-and-runtime-lifecycle.md"
test = "crates/core/pulsar_package/tests/smoke.rs (packaged_game_runs_from_a_clean_directory: every mesh bound in a headless run)"
status = "verified"







