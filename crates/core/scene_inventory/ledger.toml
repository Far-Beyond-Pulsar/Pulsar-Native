# SceneDB corrective plan: Phase 0 closure ledger (Pulsar-Native#1035).
#
# One row per exposed component class, GPU-bearing schema, GPU buffer key,
# render pass crate and lifecycle call site. This file holds the engine's
# rows; each plugin holds the rows of what it ships in its own
# plugins/vendor/<dir>/ledger.toml (Pulsar-Native#1606). `cargo test -p
# scene_inventory` recomputes every fact column from the linked registries and
# the source tree, over this file and every installed plugin's, and fails on
# any missing row, stale row, mismatched fact or row in another owner's ledger;
# a failure prints the row to add with TODO placeholders.
#
# Human columns (required on every row):
#   owner            module or crate that owns the change
#   disposition      what happens to the row in the corrective plan
#   target_contract  plan phase and contract document it must satisfy
#   test             test or reproduction proving it, or "none: <what is missing>"
#   status           broken | at-risk | unverified | verified | out-of-scope
#                    broken   = reproduced failure (named in `test`)
#                    at-risk  = source-level defect against the plan, not reproduced
#                    verified = behavior proven by the named test
#
# See 11-phase-0-closure.md for the decisions and the failure baseline.

[meta]
pulsar_native = "7b6796323"
helio = "6eebf28e"
scenedb = "fdbe195"
reflection = "2761936b"

# ── Exposed component classes ───────────────────────────────────────────
# Every REGISTRY class (the editor's Add component list); flags are checked
# against the linked registries.








[[class]]
name = "CameraComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = false
owner = "helio_component::components::camera_component"
disposition = "non-render data read by the host per frame: a camera's projection (perspective fov or orthographic size), clip planes, priority and enabled flag; its pose is its owner object's world transform. The game's camera selection (pulsar_game::camera_selection) looks through the view target's camera, else the highest priority one. Nothing on the GPU reads it"
target_contract = "Phase 5; 04-state-notifications.md"
test = "crates/core/helio_component/src/components/camera_component.rs (tests); crates/core/pulsar_game/src/camera_selection.rs (tests); crates/core/pulsar_game/src/scripting/tests.rs (possession_makes_the_pawn_the_view_target_and_its_camera_follows_it)"
status = "verified"

[[class]]
name = "ClassInstance"
category = "Scripting"
world_registered = true
own_gpu_columns = false
owner = "pulsar_class::component"
disposition = "non-render: class placement provenance (not offered in Add component). Phase 3: slot defaults are typed in a cached ClassTemplate (decoded once per class definition); overrides stay persisted as JSON diffs keyed by slot ID and are applied through reflected setters"
target_contract = "Phase 3; 05-persistence-and-undo.md"
test = "crates/editor/ui_level_editor/src/core/scene_edit/tests/classes.rs instances_are_built_from_the_typed_template"
status = "verified"





[[class]]
name = "NativeScriptComponent"
category = "Scripting"
world_registered = true
own_gpu_columns = false
owner = "pulsar_class::native_script"
disposition = "non-render: native script attachment; typed VM adapters. Declared with declare_unfinished_component! (tracked in #1079): the properties card shows the reason and issue, and the first attach logs them once"
target_contract = "Phase 3; 02-typed-reflection-and-writes.md"
test = "crates/core/pulsar_class/src/native_script.rs (native_script_component_is_declared_unfinished); crates/core/scene_inventory/tests/ledger.rs (unfinished_rows_match_unfinished_declarations); tracked in #1079"
status = "unfinished"
notes = "Attach, edit, save and undo are typed; nothing at runtime spawns the native actor it names."




[[class]]
name = "SubLevelDisplayComponent"
category = "Level"
world_registered = true
own_gpu_columns = false
owner = "helio_component::components::sublevel_display_component"
disposition = "keep: the engine's display row of a placed sublevel (the actor row engine_backend joins with the meshes' api)"
target_contract = "Phase C; plugin-migration.md"
test = "none: no test names this row; the owning plugin's suites cover its behaviour"
status = "unverified"

# ── GPU schemas ──────────────────────────────────────────────────────────
