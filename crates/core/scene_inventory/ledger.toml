path = "helio_component::components::static_mesh_draw::StaticMeshDraw"
buffers = ["static_mesh_draw_bounds", "static_mesh_draw_flags", "static_mesh_draw_sections"]
clears_on_remove = false
releases_var_len = true
registered = true
writer = "StaticMeshComponent's second GPU registration (bounds, movable flag, sections with materials resolved from the slots), on every insert, write, removal and replay"
owner = "helio_component::components::static_mesh_draw"
disposition = "keep: the scene join's per-instance mesh draw input (Phase 2)"
target_contract = "Phase 2; 03-gpu-reflection-and-rendering.md"
test = "crates/core/engine_backend/tests/scene_join_rows.rs"
status = "verified"

