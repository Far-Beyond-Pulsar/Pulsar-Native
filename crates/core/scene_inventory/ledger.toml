count = 1
owner = "engine_backend::scene (reload_updated_asset, subscribe_asset_reloads)"
disposition = "keep: the one reload path. A mesh, texture or material AssetUpdated (the project watcher publishes one for a changed image, material document or shader-graph save) reloads that file's assets in a world, a texture also every graph material sampling it, which rebinds every dependent; a class (Blueprint) update rebuilds every placed instance of that class in the world from its new definition, keeping each instance's own edits, diffed against the definition the instance was built from, which pulsar_class::world records on its root however it was built (placement, level load, a script's spawn, a rebuild) and which goes with the instance (engine_backend::scene::classes); the editor's subscription and every game loop that builds its own world go through it, so a headless world reloads without the editor"
target_contract = "SceneDB#84; 07-assets-and-runtime-lifecycle.md"
test = "crates/core/pulsar_game/tests/asset_reload.rs (a_game_world_reloads_a_reimported_mesh_without_the_editor), crates/editor/ui_level_editor/tests/mesh_reimport.rs (a_reimported_mesh_reloads_every_mesh_naming_it), crates/core/engine_backend/tests/class_reload.rs (class_updates_rebuild_instances_in_worlds_without_the_editor), crates/core/pulsar_class/tests/instances.rs (every_build_path_records_the_definition_it_built_from)"
