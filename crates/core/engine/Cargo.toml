[package]
edition = "2021"
name = "pulsar_engine"
description = "A modern high-performance game engine written in Rust"
publish = false
version = "0.2.42"
#
[[bin]]
name = "pulsar_engine"
path = "src/main.rs"
[dependencies]
pulsar_install_layout = { workspace = true }
# horizon.workspace = true
anyhow.workspace = true
gpui-ce.workspace = true
smol.workspace = true
ui = { workspace = true, features = ["tree-sitter-languages", "inspector"] }
thiserror = { workspace = true }
pulsar_error = { path = "../pulsar_error" }

wgpu.workspace = true
rfd = { workspace = true }
file-association-manager = { git = "https://github.com/Far-Beyond-Pulsar/file-association-manager", rev = "6ca80ae7ab73e050bdb40f7f08d538bb8330c2d3" }

# Engine crates
engine_backend.workspace = true
engine_state.workspace = true
engine_fs = { workspace = true }
pulsar_auth.workspace = true
# Profiling - instrumentation-based
profiling = { workspace = true }
# Tracy frontend (crates.io `profiling` v1). Feature-unifies with gpui-ce's
# own copy, so `--features profile-tracy` also enables every
# `wgpui: ...` zone inside the gpui render path.
profiling-v1 = { workspace = true }

# UI crates - commented out to avoid circular dependency during build
# The UI crates depend on engine, so we can't have engine depend on them
# Instead, engine will link against them at runtime
ui_core.workspace = true
ui_common.workspace = true
ui_loading_screen.workspace = true
ui_log_viewer.workspace = true
editor_task_queue.workspace = true
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rust-embed = { workspace = true, features = ["interpolate-folder-path", "include-exclude"] }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
directories = { workspace = true }
toml = { workspace = true }

sysuri.workspace = true
urlencoding.workspace = true
dotenv = "0.15"
window_manager.workspace = true
# The installed plugins, with their roots' editor registrations (Blueprints,
# TypeScript, the trait and render graph editors and every other plugin's
# editors among them): the editor has
# every one, the project it opens enables some (`pulsar_plugins`).
installed_plugins = { workspace = true, features = ["editor"] }
# The optional editor tools this editor ships (architecture/layers.toml's
# `tool` layer): each registers its status-bar button, title-bar item,
# loading step or chat provider (`ui_common::editor_tools`,
# `agent_chat_core::AgentProviderRegistration`); the shell names none.
ui_git_manager = { workspace = true }
ui_flamegraph = { workspace = true }
ui_fab_search = { workspace = true }
agent_provider_demo_random = { workspace = true }
agent_provider_github_copilot = { workspace = true }
agent_provider_openai = { workspace = true }
agent_provider_opencode = { workspace = true }
agent_provider_anthropic = { workspace = true }
agent_provider_gemini = { workspace = true }
agent_provider_docker_model_runner = { workspace = true }
agent_provider_aws_bedrock = { workspace = true }
agent_provider_vertex_ai = { workspace = true }
pulsar_std = { workspace = true }
tracing-appender = "0.2.4"

# Optional heap profiler for tracking down memory leaks. Enable with
# `--features dhat-heap`; replaces the normal tracking allocator so it can't
# run alongside it. Dumps `dhat-heap.json` on clean process exit — view at
# https://nnethercote.github.io/dh_view/dh_view.html
dhat = { version = "0.3", optional = true }

[features]
# Blueprints, TypeScript and the trait and render graph editors are plugins
# (`pulsar.blueprints`, `pulsar.typescript`, `pulsar.trait_editor`,
# `pulsar.render_graph`) in the installed set, which a project enables.
default = []
dhat-heap = ["dep:dhat"]
# Live shader editing is on by default through helio; this forwards the feature
# for builds that disable helio's defaults. See engine_backend's feature of the
# same name.
shader-hot-reload = ["engine_backend/shader-hot-reload"]
# Tracy CPU profiling. Also switches gpui-ce (wgpui) to Tracy via feature
# unification on the shared crates.io `profiling` package, so the render
# path's `wgpui: ...` zones appear in the same capture.
profile-tracy = [
    "profiling-v1/profile-with-tracy",
    "gpui-ce/profile-tracy",
]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader"] }

# Windows on ARM has no static DXC, so the engine installs and loads Microsoft's (dxc.rs).
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
sha2 = { workspace = true }
dirs = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = { workspace = true }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
plugin_manager = { workspace = true }
plugin_editor_api = { workspace = true }

[lints]
workspace = true

[package.metadata.bundle]
name = "Pulsar"
identifier = "dev.pulsar.engine"
icon = ["assets/images/logo_sqrkl_mac.icns"]
copyright = "Copyright © 2025-2026 Tristan J. Poland"
category = "Developer Tool"
short_description = "A modern high-performance game engine"
long_description = "Pulsar is a modern, high-performance game and simulation engine written in Rust."

[package.metadata.bundle.macos]
minimum_system_version = "12.0"
high_resolution_capable = true
