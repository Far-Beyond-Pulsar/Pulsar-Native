[package]
edition = "2021"
name = "pulsar_engine"
description = "A modern high-performance game engine written in Rust"
publish = false
version = "0.2.42"
#
[[bin]]
name = "pulsar_engine"
path = "src/main.rs"
[dependencies]
# horizon.workspace = true
anyhow.workspace = true
gpui-ce.workspace = true
ui = { workspace = true, features = ["tree-sitter-languages", "inspector"] }
thiserror = { workspace = true }
wgpu.workspace = true
rfd = { workspace = true }
file-association-manager = { git = "https://github.com/Far-Beyond-Pulsar/file-association-manager", rev = "6ca80ae7ab73e050bdb40f7f08d538bb8330c2d3" }

# Engine crates
engine_backend.workspace = true
engine_state.workspace = true
pulsar_auth.workspace = true
# Profiling - instrumentation-based
profiling = { workspace = true }
# Tracy frontend (crates.io `profiling` v1). Feature-unifies with gpui-ce's
# own copy, so `--features profile-tracy` also enables every
# `wgpui: ...` zone inside the gpui render path.
profiling-v1 = { workspace = true }

# UI crates - commented out to avoid circular dependency during build
# The UI crates depend on engine, so we can't have engine depend on them
# Instead, engine will link against them at runtime
ui_core.workspace = true
ui_common.workspace = true
ui_loading_screen.workspace = true
ui_log_viewer.workspace = true
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rust-embed = { workspace = true, features = ["interpolate-folder-path", "include-exclude"] }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
directories = { workspace = true }
toml = { workspace = true }

sysuri.workspace = true
urlencoding.workspace = true
dotenv = "0.15"
window_manager.workspace = true
pulsar_std = { workspace = true }
tracing-appender = "0.2.4"

# Optional heap profiler for tracking down memory leaks. Enable with
# `--features dhat-heap`; replaces the normal tracking allocator so it can't
# run alongside it. Dumps `dhat-heap.json` on clean process exit — view at
# https://nnethercote.github.io/dh_view/dh_view.html
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]
# Tracy CPU profiling. Also switches gpui-ce (wgpui) to Tracy via feature
# unification on the shared crates.io `profiling` package, so the render
# path's `wgpui: ...` zones appear in the same capture.
profile-tracy = [
    "profiling-v1/profile-with-tracy",
    "gpui-ce/profile-tracy",
]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Diagnostics_Debug"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = { workspace = true }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.bundle]
name = "Pulsar"
identifier = "dev.pulsar.engine"
icon = ["assets/images/logo_sqrkl_mac.icns"]
copyright = "Copyright © 2025-2026 Tristan J. Poland"
category = "Developer Tool"
short_description = "A modern high-performance game engine"
long_description = "Pulsar is a modern, high-performance game and simulation engine written in Rust."

[package.metadata.bundle.macos]
minimum_system_version = "12.0"
high_resolution_capable = true
