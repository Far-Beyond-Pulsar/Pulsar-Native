[package]
name = "ui_git_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
gpui-ce.workspace = true
window_manager.workspace = true
inventory.workspace = true
ui = { workspace = true, features = ["tree-sitter-languages"] }
ui_common = { workspace = true }
engine_fs.workspace = true
engine_state = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
git2 = { workspace = true }
keyring = "3"
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
similar = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "rustls-no-provider", "system-proxy"] }
image = { workspace = true, features = ["png", "jpeg"] }
smallvec = { workspace = true }
smol = { workspace = true }
tracing = { workspace = true }

# Read-only Mockaco editor surfaces, the same editor the code editor plugin uses.
mockaco-gpui = { git = "https://github.com/Far-Beyond-Pulsar/Mockaco", rev = "e36ce16e76716b7494a7388e3ba51505111246b8", features = ["native-wgpui"] }
mockaco-language = { git = "https://github.com/Far-Beyond-Pulsar/Mockaco", rev = "e36ce16e76716b7494a7388e3ba51505111246b8" }
mockaco-core = { git = "https://github.com/Far-Beyond-Pulsar/Mockaco", rev = "e36ce16e76716b7494a7388e3ba51505111246b8" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
