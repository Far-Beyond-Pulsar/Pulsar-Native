[package]
name = "ui_multiplayer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
editor_task_queue = { workspace = true }
# UI framework
gpui-ce.workspace = true
ui.workspace = true
ui_common.workspace = true
window_manager.workspace = true
engine_backend.workspace = true
engine_state.workspace = true
engine_fs.workspace = true
serde_json = { workspace = true }
futures = { workspace = true }
# The relay client (`net::multiuser`) and the file sync (`net::simple_sync`).
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
async-tungstenite = { version = "0.35", features = ["tokio-runtime"] }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
walkdir = { workspace = true }
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }
similar = { workspace = true }
mockaco-gpui = { git = "https://github.com/Far-Beyond-Pulsar/Mockaco", rev = "e36ce16e76716b7494a7388e3ba51505111246b8", features = ["native-wgpui"] }
mockaco-language = { git = "https://github.com/Far-Beyond-Pulsar/Mockaco", rev = "e36ce16e76716b7494a7388e3ba51505111246b8" }

[lints]
workspace = true
