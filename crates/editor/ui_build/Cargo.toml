[package]
name = "ui_build"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-ce.workspace = true
engine_fs = { workspace = true }
ui = { workspace = true }
ui_common = { workspace = true }
window_manager = { workspace = true }
engine_state = { workspace = true }
engine_backend = { workspace = true }
editor_task_queue = { workspace = true }
# What a failed build or a crashed game tells the Problems panel.
pulsar_findings = { workspace = true }
# The build tools (`build_start`, `build_status`, ...) it registers, and the UI-thread bridge they use.
pulsar_mcp = { workspace = true }
pulsar_plugins = { workspace = true }
parking_lot = { workspace = true }
profiling = { workspace = true }
rust-i18n.workspace = true
serde_json = { workspace = true }
smol = { workspace = true }
tracing = { workspace = true }
# The pack step: the content packer seam and the `Content/` folder name.
pulsar_content = { workspace = true }
plugin_manager = { workspace = true }
sysinfo = "0.39"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "mp3"] }

[dev-dependencies]
tempfile = { workspace = true }
image = { workspace = true }
# Headless windows for the configurator's layout test.
gpui-ce = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
