[package]
name = "ui_build"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-ce.workspace = true
engine_fs = { workspace = true }
ui = { workspace = true }
ui_common = { workspace = true }
window_manager = { workspace = true }
engine_state = { workspace = true }
engine_backend = { workspace = true }
editor_task_queue = { workspace = true }
parking_lot = { workspace = true }
profiling = { workspace = true }
rust-i18n.workspace = true
serde_json = { workspace = true }
smol = { workspace = true }
tracing = { workspace = true }
# The build dashboard: Mission Control's log view for the build's output,
# and the process sampling for its process list and charts.
ui_log_viewer = { workspace = true }
sysinfo = "0.39"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "mp3"] }

[dev-dependencies]
tempfile = { workspace = true }
image = { workspace = true }
# Headless windows for the configurator's layout test.
gpui-ce = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
