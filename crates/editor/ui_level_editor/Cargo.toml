[package]
name = "ui_level_editor"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The extension points (`extend`): plugins' editor crates register tool
# modes, create entries, World Settings sections, undo steps, save hooks and
# overlays, each naming its origin; a disabled plugin's are skipped.
pulsar_plugins = { workspace = true }
inventory = { workspace = true }
# UI framework
gpui-ce.workspace = true
ui.workspace = true

# UI crates
ui_common.workspace = true
plugin_manager = { workspace = true }
ui_types_common.workspace = true
window_manager.workspace = true
plugin_editor_api.workspace = true
anyhow.workspace = true
tool_registry = { workspace = true }
tool_registry_macros = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_world_registry = { workspace = true }

# Engine
engine_state.workspace = true
editor_task_queue.workspace = true
engine_backend.workspace = true
# Level file format types shared with the runtime loader (SceneFile's
# BlueprintBindings, #650) so editor saves round-trip the section.
pulsar_scene.workspace = true
pulsar_class.workspace = true
# Play-In-Editor input ABI (game tab forwards InputEvent to the embedded game)
pulsar_pie_abi.workspace = true
# The PIE events panel reads the game's event hub snapshot (#924).
pulsar_events.workspace = true
ui_build.workspace = true
# M3-alpha Task 2 (audit follow-up): `prims-gpui` is required here —
# `level_editor/ui/properties/object_type_fields/property_renderer.rs`
# constructs `pulsar_reflection::PropertyEditorArgs`'s GPUI-typed
# `on_bool_toggle`/`on_enum_select` fields directly. `gpui-ce`/`ui` are
# already unconditional deps of this crate above.
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
helio_component.workspace = true
helio.workspace = true
# No plugin's crate: every kind's editor UI is its plugin's editor crate,
# registered through `extend` (Phase C step 3).
helio-pass-buffer-view.workspace = true
engine_fs.workspace = true
profiling.workspace = true
ui_helio_viewport.workspace = true

glam.workspace = true

# Standard dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rfd = { workspace = true }
parking_lot = { workspace = true }
tracing.workspace = true
chrono = { workspace = true, features = ["serde"] }
schemars = { workspace = true }
device_query = "4.0.1"
raw-window-handle = "0.6"
rust-i18n.workspace = true
wgpu.workspace = true
smol = { workspace = true }
image.workspace = true
png.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics2 = "0.6"
core-foundation-sys = { workspace = true }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"  # separate crate for Foundation types

# Viewport mouse-look on Wayland (`viewport/cursor/wayland.rs`): relative
# pointer + pointer constraints on winit's own wl_display. Same versions winit
# already pulls in, so these unify with its copies.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["winuser", "shellapi"] }

[dev-dependencies]
# Every installed plugin's root crate (`installed_plugins`, without its
# `editor` feature unless the build enables it): a few unit tests edit kinds
# through their components (the commands, the scene edits, the properties
# panel's budget, the default level's generator), reaching each kind's types
# through the installed set. The editor's tests with every plugin (render
# acceptance, virtual geometry, mesh reimport) are the installed set's own
# (`plugins/installed/tests`).
installed_plugins = { workspace = true }
tempfile = { workspace = true }
# Headless `TestAppContext` window for the properties-panel layout budget test
# (`workspace/panels/properties_perf_tests.rs`). Test binaries only.
gpui-ce = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
