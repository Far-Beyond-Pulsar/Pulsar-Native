[package]
name = "ui_core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pulsar_install_layout = { workspace = true }
profiling = { workspace = true }
# The level editor provider names the engine as its origin.
pulsar_plugins = { workspace = true }
# UI framework
gpui-ce.workspace = true
ui.workspace = true

# UI crates (all of them!)
ui_common.workspace = true
ui_types_common.workspace = true
ui_level_editor.workspace = true
ui_multiplayer.workspace = true
ui_problems.workspace = true
ui_type_debugger.workspace = true
ui_file_manager.workspace = true
ui_plugin_manager.workspace = true
ui_settings.workspace = true
ui_about.workspace = true
ui_documentation.workspace = true
ui_keybindings.workspace = true
ui_multiuser_status.workspace = true
ui_friends.workspace = true


# Engine
engine_state.workspace = true
engine_fs = { workspace = true }
pulsar_settings.workspace = true
engine_backend.workspace = true
pulsar_reflection.workspace = true
window_manager.workspace = true

# Plugin system
plugin_manager = { workspace = true }
plugin_editor_api = { workspace = true }
editor_task_queue = { workspace = true }
pulsar_world_registry = { workspace = true }
# Script problems from Play-in-Editor on the host bus (#854, #868).
pulsar_events = { workspace = true }

asset_import = { workspace = true }
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true }
tracing.workspace = true
smol = { workspace = true }
futures = { workspace = true }
rust-i18n.workspace = true
serde_json = { workspace = true }
image.workspace = true
sha2.workspace = true
anyhow.workspace = true
agent_chat_core.workspace = true
directories.workspace = true
ui_loading_screen.workspace = true
agent_chat_tools.workspace = true
dirs = { workspace = true }
rfd = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Headless `TestAppContext` windows for the unified sidebar test
# (`app/nav_sidebar/tests.rs`). Test binaries only.
gpui-ce = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# Saves that test's optional screenshots.
image = { workspace = true }
# The editor window builds HTTP clients; the engine binary installs this
# provider at startup, the test does the same (same spec as `engine`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
