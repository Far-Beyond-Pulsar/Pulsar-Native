[package]
name = "ui_problems"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# UI framework
gpui-ce.workspace = true
engine_fs = { workspace = true }
# A language's highlighter id for the preview of a problem's file.
pulsar_language = { workspace = true }
ui.workspace = true

# UI crates
ui_common.workspace = true
window_manager.workspace = true
tracing = { workspace = true }
similar = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rust-i18n.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpui-ce = { workspace = true, features = ["test-support"] }
