[package]
name = "pulsar_scene"
version = "0.1.0"
edition = "2021"
description = "Scene file format and Helio loader for the Pulsar game runtime"

[dependencies]
helio               = { workspace = true }
helio-asset-compat  = { workspace = true }
glam       = { workspace = true }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing    = { workspace = true }
# Same reflection + component registrations the engine uses — ensures identical dispatch
pulsar_reflection  = { workspace = true }
helio_component    = { workspace = true }
pulsar_events      = { workspace = true }
# Canonical scene/level JSON schema (Pulsar-Native#557) — `format` is a
# re-export of it plus the runtime-only projected-prop extension trait.
pulsar_scene_format = { workspace = true }

[lints]
workspace = true
