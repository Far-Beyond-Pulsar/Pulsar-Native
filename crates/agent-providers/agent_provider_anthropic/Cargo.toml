[package]
name = "agent_provider_anthropic"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Its registration with the editor's chat (`agent_chat_core::AgentProviderRegistration`).
pulsar_plugins = { workspace = true }
anyhow.workspace = true
agent_chat_core.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "rustls-no-provider", "system-proxy"] }
serde_json.workspace = true
tracing = { workspace = true }

[lints]
workspace = true
