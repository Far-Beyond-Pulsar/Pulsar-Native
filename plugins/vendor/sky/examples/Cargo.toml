[package]
name = "sky-examples"
version = "0.1.0"
edition = "2021"
publish = false
description = "The sky plugin's standalone hosts on Helio: Earth's atmosphere over a lit scene"

[features]
default = ["gpu"]
gpu = []

[[bin]]
name = "render_v2_sky"
path = "render_v2_sky.rs"

[dependencies]
helio-light-host = { workspace = true }
helio-light-api = { workspace = true }
helio-mesh-host = { workspace = true }
helio-mats = { workspace = true }
env_logger = "0.11"
glam = { workspace = true }
helio = { workspace = true }
helio-bake = { workspace = true }
helio-components = { workspace = true, features = ["bake"] }
helio-core = { workspace = true }
helio-feature-api = { workspace = true }
helio-mesh-api = { workspace = true }
helio-pass-debug-overlay = { workspace = true }
helio-pass-forward-lit = { workspace = true }
helio-pass-gi = { workspace = true }
helio-pass-perf-overlay = { workspace = true }
helio-pass-sky = { workspace = true, features = ["host-rows"] }
helio-presets = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
log = { workspace = true }
pollster = "0.4"
# `#[derive(SceneStore)]` expands to reflection paths.
pulsar_reflection = { workspace = true }
pulsar_scenedb = { workspace = true }
scenedb-inspector-agent = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
