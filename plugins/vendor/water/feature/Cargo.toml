[package]
name = "helio-pass-water-sim"
version = "0.1.0"
edition = "2021"

[features]
default = ["gpu"]
gpu = []
# Row components for standalone hosts (`host_rows`): examples and tests
# enable it; engines derive the rows from their own components.
host-rows = ["dep:helio-components", "dep:pulsar_scenedb_derive", "dep:serde_json"]

[dependencies]
helio-components = { workspace = true, optional = true }
pulsar_scenedb_derive = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
helio-foliage-api = { workspace = true }
helio-scene-join = { workspace = true }
helio-frame-api = { workspace = true }
helio-water-api = { workspace = true }
helio-feature-api = { workspace = true }
pulsar_reflection = { workspace = true }
helio-core = { workspace = true }
helio-mats = { workspace = true }
helio-pass-hiz = { workspace = true }
helio-sky-api = { workspace = true }
helio-pass-gbuffer = { workspace = true }
helio-pass-object-batch = { workspace = true }
helio-pass-indirect-dispatch = { workspace = true }
helio-pass-occlusion-cull = { workspace = true }
helio-pass-deferred-light = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pulsar_scenedb = { workspace = true }
glam = { workspace = true }
rayon = "1.12"

[dev-dependencies]
pollster = "=0.4.0"
