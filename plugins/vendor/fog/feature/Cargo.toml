[package]
name = "helio-pass-volumetric-fog"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: helio-pass-volumetric-fog"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
gpu = []
# Row components for standalone hosts (`host_rows`): examples and tests
# enable it; engines derive the rows from their own components.
host-rows = ["dep:helio-components", "dep:pulsar_scenedb_derive", "dep:serde_json"]

[dependencies]
helio-components = { workspace = true, optional = true }
pulsar_scenedb_derive = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
helio-scene-join = { workspace = true }
helio-frame-api = { workspace = true }
helio-feature-api = { workspace = true }
pulsar_reflection = { workspace = true }
helio-core = { workspace = true }
helio-pass-postprocess = { workspace = true }
helio-pass-shadow-matrix = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pulsar_scenedb = { workspace = true }

[dev-dependencies]
# The tests author media and post-process volumes as host rows.
helio-pass-volumetric-fog = { path = ".", features = ["host-rows"] }
helio-pass-post-volumes = { workspace = true, features = ["host-rows"] }
helio-components = { workspace = true }
pollster = "=0.4.0"
glam = { workspace = true }
