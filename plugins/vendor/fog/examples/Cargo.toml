[package]
name = "fog-examples"
version = "0.1.0"
edition = "2021"
publish = false
description = "The fog plugin's standalone hosts on Helio: the volumetric fog demo"

[features]
default = ["gpu"]
gpu = []

[[bin]]
name = "volumetric_fog_demo"
path = "volumetric_fog_demo.rs"

[dependencies]
helio-mesh-host = { workspace = true }
helio-pass-light-cull = { workspace = true }
helio-mats = { workspace = true }
bytemuck = { workspace = true }
env_logger = "0.11"
glam = { workspace = true }
helio = { workspace = true }
helio-components = { workspace = true }
helio-core = { workspace = true }
helio-feature-api = { workspace = true }
helio-mesh-api = { workspace = true }
helio-pass-forward-lit = { workspace = true }
helio-pass-object-batch = { workspace = true }
helio-pass-post-volumes = { workspace = true, features = ["host-rows"] }
helio-pass-postprocess = { workspace = true }
helio-pass-shadow-matrix = { workspace = true }
helio-pass-volumetric-fog = { workspace = true, features = ["host-rows"] }
helio-pass-gi = { workspace = true }
helio-pass-sky = { workspace = true, features = ["host-rows"] }
helio-presets = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
log = { workspace = true }
pollster = "0.4"
# `#[derive(SceneStore)]` expands to reflection paths.
pulsar_reflection = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
scenedb-inspector-agent = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
