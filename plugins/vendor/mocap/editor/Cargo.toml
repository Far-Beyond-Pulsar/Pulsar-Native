[package]
name = "mocap_editor"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"
description = "The mocap editor (pulsar.mocap): live capture session, camera viewport, timeline and skeleton preview for .mocap takes"

[features]
# Webcam capture in the sources panel.
camera = ["mocap_capture/camera"]
# Body tracking from camera video (a user-supplied ONNX keypoint model).
pose = ["mocap_capture/pose"]

[dependencies]
gpui-ce = { workspace = true }
ui = { workspace = true }
plugin_editor_api = { workspace = true, features = ["editor"] }
plugin_manager = { workspace = true }
engine_fs = { workspace = true }
editor_task_queue = { workspace = true }
mocap_format = { path = "../format" }
mocap_capture = { path = "../capture" }
wgpu = { workspace = true }
bytemuck = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
