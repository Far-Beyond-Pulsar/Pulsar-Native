[package]
name = "mocap_capture"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"
description = "Mocap capture (pulsar.mocap): sources (VMC/OSC, synthetic, cameras), the frame bus, filtering, calibration and the recorder. GPUI-free."

[features]
# Webcam capture through the OS's own API (Media Foundation, AVFoundation, V4L2).
camera = ["dep:nokhwa", "dep:image"]
# Body keypoints from camera video with an ONNX model (ONNX Runtime).
pose = ["dep:ort"]

[dependencies]
mocap_format = { path = "../format" }
nokhwa = { version = "0.10", default-features = false, features = ["input-native"], optional = true }
image = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
# Every capture thread is a registered service (the Tasks window lists it).
editor_task_queue = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
nalgebra = { version = "0.32", default-features = false, features = ["std"] }
tracing = { workspace = true }

[dev-dependencies]
nalgebra = { version = "0.32", default-features = false, features = ["std"] }

[build-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
