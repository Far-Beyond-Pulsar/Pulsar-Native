[package]
name = "mocap_format"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"
description = "The .mocap take format (pulsar.mocap): container, take model, rig profiles and signal tools. Engine-free and GPUI-free."

[dependencies]
crc32fast = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
