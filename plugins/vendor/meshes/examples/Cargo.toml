[package]
name = "meshes-examples"
version = "0.1.0"
edition = "2021"

[features]
# Heavy, download-capable dependencies and the build-script provisioning of the
# vg_stress scan meshes. Off by default: other examples never download anything.
vg-stress = ["dep:ureq", "dep:flate2", "dep:sha2"]

[build-dependencies]
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }
flate2 = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
serde_json = { workspace = true }

