[package]
name = "helio-vg-build"
version = "0.1.0"
edition = "2021"
description = "Virtual geometry cluster-DAG builder and .vgeo writer/reader (pure CPU, no GPU dependencies)"
license = "MIT OR Apache-2.0"

[dependencies]
helio-vg-format = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
rayon = "1"
meshopt = "=0.6.2"

[dev-dependencies]
serde_json = { workspace = true }
image = { workspace = true }
