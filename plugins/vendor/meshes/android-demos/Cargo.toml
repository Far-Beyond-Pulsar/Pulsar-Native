[package]
name = "helio-android-demos"
version = "0.1.0"
edition = "2021"
description = "Helio demos compiled for Android — one feature per demo"

[package.metadata.android]
package = "com.helio.editor_demo_mini"
label = "Helio Editor Demo Mini"
icon = "@mipmap/ic_launcher"

[package.metadata.android.signing.release]
path = "C:\\Users\\redst\\.android\\debug.keystore"
keystore_password = "android"
keystore_alias = "androiddebugkey"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
editor_demo_mini = []

[dependencies]
helio-pass-materials = { workspace = true }
helio-light-api = { workspace = true }
helio-feature-api = { workspace = true }
helio-mesh-host = { workspace = true }
pulsar_scenedb = { workspace = true }
helio-mesh-api = { workspace = true }
helio               = { workspace = true }
helio-wasm = { workspace = true }
helio-presets = { workspace = true }
wgpu                = { workspace = true }
glam                = { workspace = true }
log                 = { workspace = true }
env_logger = { version = "0.11" }

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
