[package]
name = "meshes_plugin"
version = "0.1.0"
edition = "2024"
description = "Meshes (pulsar.meshes): the editor plugin -- its metadata, over the plugin's component crate"

[lib]
name = "meshes_plugin"

[features]
# Statically linked hosts (the editor) use the Rust API; the component crate
# (with everything it registers) comes with this crate.
builtin = []

[dependencies]
meshes_component = { workspace = true }
plugin_editor_api = { workspace = true }
# The level editor UI: registrations through its extension points
# (`ui_level_editor::extend`), each naming its origin.
ui_level_editor = { workspace = true }
ui = { workspace = true }
pulsar_scene_model = { workspace = true }
inventory = { workspace = true }
pulsar_plugins = { workspace = true }
rust-i18n = { workspace = true }
helio_component = { workspace = true }
# Asset-browser thumbnails (`thumbnails`): source models through the
# meshes' snapshot renderer, `.mesh` files rasterised on the CPU.
ui_common = { workspace = true }
helio_snapshot = { workspace = true }
pulsar_reflection = { workspace = true }
image = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
helio-mesh-api = { workspace = true }

[lints]
workspace = true
