# The `pulsar.meshes` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). The runtime module carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.meshes"
name = "Meshes"
description = "Static, skeletal and virtual-geometry meshes: their batching, culling, drawers and asset import"
enabled_by_default = true
requires = []

[modules]
# What a game built for the project links.
runtime = ["meshes_component"]
# What the editor links in addition.
editor = ["meshes_plugin"]
