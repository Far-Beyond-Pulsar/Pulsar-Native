[package]
name = "helio-pass-vg-raster"
version = "0.1.0"
edition = "2021"
description = "Helio virtual geometry raster: Tier 1 hardware visbuffer raster, Tier 2 software micro-polygon raster, tile classification"
license = "MIT OR Apache-2.0"

[dependencies]
helio-core      = { workspace = true }
helio-vg-format = { workspace = true }
helio-mats = { workspace = true }
helio-pass-vg-cull = { workspace = true }
wgpu            = { workspace = true }
bytemuck        = { workspace = true, features = ["derive"] }
log             = { workspace = true }

[dev-dependencies]
naga     = { version = "30.0.0", features = ["wgsl-in"] }
pollster = { version = "0.4" }
glam     = { workspace = true }
