[package]
name = "helio-pass-object-batch"
version = "0.1.0"
edition = "2021"
description = "GPU-driven sort/group/batch pipeline: turns SceneDB's StaticObjectComponent rows into instances/draw_calls/material_class_ranges with zero per-frame CPU involvement"

[dependencies]
helio-light-api = { workspace = true }
helio-mesh-api = { workspace = true }
helio-feature-api = { workspace = true }
helio-frame-api = { workspace = true }
helio-scene-join = { workspace = true }
glam = { workspace = true }
helio-core = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
pulsar_scenedb = { workspace = true }

[dev-dependencies]
helio = { workspace = true }
helio-pass-light-cull = { workspace = true }
helio-mesh-host = { workspace = true }
helio-components = { workspace = true }
pollster = "0.4"
naga = { version = "30", features = ["wgsl-in"] }
