[package]
name = "helio-pass-transparent"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: helio-pass-transparent"
license = "MIT OR Apache-2.0"

[dependencies]
helio-frame-api = { workspace = true }
helio-feature-api = { workspace = true }
helio-core  = { workspace = true }
helio-mats  = { workspace = true }
helio-pass-gbuffer = { workspace = true }
helio-pass-light-cull = { workspace = true }
helio-pass-occlusion-cull = { workspace = true }
wgpu      = { workspace = true }
bytemuck  = { workspace = true, features = ["derive"] }
log       = { workspace = true }
pulsar_scenedb = { workspace = true }

[dev-dependencies]
pollster = { version = "0.4" }
