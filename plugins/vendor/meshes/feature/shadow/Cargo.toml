[package]
name = "helio-pass-shadow"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: helio-pass-shadow"
license = "MIT OR Apache-2.0"

[dependencies]
helio-light-api = { workspace = true }
helio-mesh-api = { workspace = true }
helio-frame-api = { workspace = true }
helio-feature-api = { workspace = true }
helio-core  = { workspace = true }
helio-pass-shadow-matrix = { workspace = true }
helio-pass-shadow-dirty = { workspace = true }
helio-pass-gbuffer = { workspace = true }
helio-mats = { workspace = true }
wgpu      = { workspace = true }
bytemuck  = { workspace = true, features = ["derive"] }
log       = { workspace = true }

[dev-dependencies]
helio-light-host = { workspace = true }
helio = { workspace = true }
pulsar_scenedb = { workspace = true }
helio-mesh-host = { workspace = true }
helio-components = { workspace = true }
helio-mats = { workspace = true, features = ["host-rows"] }
pollster = { version = "0.4" }
glam = { workspace = true }
