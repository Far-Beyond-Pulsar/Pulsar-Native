[package]
name = "helio-snapshot"
version = "0.1.0"
edition = "2021"
description = "Headless snapshot renderer for Helio — loads a model file, renders one frame, saves a PNG"
license = "MIT OR Apache-2.0"

[dependencies]
helio-light-host = { workspace = true }
helio-light-api = { workspace = true }
helio-mesh-api = { workspace = true }
helio-mesh-host = { workspace = true }
helio-mats = { workspace = true }
helio-components = { workspace = true }
helio-asset-compat = { workspace = true }
helio              = { workspace = true }
helio-presets = { workspace = true }
pulsar_scenedb = { workspace = true }
wgpu               = { workspace = true }
glam               = { workspace = true }
bytemuck           = { workspace = true, features = ["derive"] }
image              = { workspace = true, features = ["png", "jpeg"] }
pollster = { version = "0.4" }
thiserror          = { workspace = true }
log                = { workspace = true }
futures-channel    = "0.3"

[dev-dependencies]
env_logger = { version = "0.11" }

[[example]]
name = "snapshot_test_fbx"
path = "examples/snapshot_test_fbx.rs"

[[example]]
name = "batch_benchmark"
path = "examples/batch_benchmark.rs"
