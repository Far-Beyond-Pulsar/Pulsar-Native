[package]
name = "helio-mesh-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "The meshes' SceneDB components and ray-tracing projection for standalone Helio hosts (pulsar.meshes): the plugin's examples, tests, web and Android demos. Engines register their own components."

[features]
default = ["gpu"]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
gpu = []

[dependencies]
helio-scene-derivations = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
helio = { workspace = true }
helio-asset-compat = { workspace = true }
helio-bake = { workspace = true }
helio-components = { workspace = true }
helio-core = { workspace = true }
helio-feature-api = { workspace = true }
helio-presets = { workspace = true }
helio-frame-api = { workspace = true }
helio-mats = { workspace = true }
helio-mesh-api = { workspace = true }
helio-pass-forward-lit = { workspace = true }
helio-pass-gbuffer = { workspace = true, features = ["host-rows"] }
helio-pass-light-cull = { workspace = true }
helio-pass-object-batch = { workspace = true }
helio-pass-occlusion-cull = { workspace = true }
helio-pass-shadow = { workspace = true }
helio-pass-transparent = { workspace = true }
helio-pass-vg = { workspace = true }
helio-vg-stream = { workspace = true }
log = { workspace = true }
pulsar_reflection = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
serde_json = { workspace = true }
twox-hash = { workspace = true, features = ["xxhash3_64"] }
wgpu = { workspace = true }

[dev-dependencies]
bytemuck = { workspace = true }
half = "2"
helio-pass-hlfs = { workspace = true }
helio-pass-shadow-matrix = { workspace = true }
image = { workspace = true }
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
