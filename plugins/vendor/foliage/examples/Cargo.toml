[package]
name = "foliage-examples"
version = "0.1.0"
edition = "2021"
publish = false
description = "The foliage plugin's standalone hosts on Helio: the foliage demo"

[features]
default = ["gpu"]
gpu = []

[[bin]]
name = "foliage_demo"
path = "foliage_demo.rs"

[dependencies]
env_logger = "0.11"
glam = { workspace = true }
helio = { workspace = true }
helio-components = { workspace = true }
helio-feature-api = { workspace = true }
helio-mesh-api = { workspace = true }
helio-pass-foliage-gbuffer = { workspace = true }
helio-pass-foliage-place = { workspace = true, features = ["host-rows"] }
helio-pass-forward-lit = { workspace = true }
helio-pass-gbuffer = { workspace = true }
helio-pass-gi = { workspace = true }
helio-pass-sky = { workspace = true, features = ["host-rows"] }
helio-presets = { workspace = true }
log = { workspace = true }
pollster = "0.4"
# `#[derive(SceneStore)]` expands to reflection paths.
pulsar_reflection = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
scenedb-inspector-agent = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
