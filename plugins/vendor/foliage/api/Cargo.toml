[package]
name = "helio-foliage-api"
version = "0.1.0"
edition = "2021"
description = "The foliage feature's public contract: GPU records, packing, placement reference maths, the ground protocol, SceneDB rows and the shared WGSL. No wgpu."
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
# `#[derive(SceneStore)]` (`host_rows`) checks the deriving crate's own `gpu` feature.
gpu = []
# Row components for standalone hosts (`host_rows`): examples and tests
# enable it (through the placement crate's `host-rows`); engines derive the
# rows from their own components.
host-rows = ["dep:helio-components", "dep:pulsar_scenedb_derive", "dep:pulsar_reflection", "dep:serde_json", "dep:wgpu"]

[dependencies]
helio-components = { workspace = true, optional = true }
pulsar_scenedb_derive = { workspace = true, optional = true }
pulsar_reflection = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
helio-core = { workspace = true }
pulsar_scenedb = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
