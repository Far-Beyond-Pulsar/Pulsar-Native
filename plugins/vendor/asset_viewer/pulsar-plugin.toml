# The `pulsar.asset_viewer` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its editors and file types are
# absent (see crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.asset_viewer"
name = "Asset Viewer"
description = "Viewers for model files, meshes and images, and a mesh's slot materials"
enabled_by_default = true
# It views materials' and meshes' assets, through their api crates.
requires = [
  { id = "pulsar.materials.api" },
  { id = "pulsar.meshes.api" },
]

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. An editor tool: a game never links it.
root = "asset_viewer_plugin"
editor_only = true
