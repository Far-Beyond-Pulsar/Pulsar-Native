[package]
name = "asset_viewer_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "asset_viewer_plugin"

[features]
# Pulsar statically links this crate when it is used as a built-in editor.
# Dynamic plugin builds keep the loader ABI exports by default.
builtin = []

[dependencies]
gpui-ce = { workspace = true }
ui      = { workspace = true }

plugin_editor_api = { workspace = true }
ui_common         = { workspace = true }

wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
bytemuck = { workspace = true }
parking_lot = { workspace = true }
glam = { workspace = true }

solid-rs =  { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "b9eb501f0d3b735d407c7b566a9de8ef2ab9ebf6" }
solid-fbx = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "b9eb501f0d3b735d407c7b566a9de8ef2ab9ebf6" }
