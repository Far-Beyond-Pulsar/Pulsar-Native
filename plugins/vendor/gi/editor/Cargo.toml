[package]
name = "gi_plugin"
version = "0.1.0"
edition = "2024"
description = "GI (pulsar.gi): the editor plugin -- its metadata, over the plugin's component crate"

[lib]
name = "gi_plugin"

[features]
# Statically linked hosts (the editor) use the Rust API; the component crate
# (with everything it registers) comes with this crate.
builtin = []

[dependencies]
gi_component = { workspace = true }
plugin_editor_api = { workspace = true }

[lints]
workspace = true
