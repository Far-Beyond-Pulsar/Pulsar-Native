[package]
name = "input_plugin"
version = "0.1.0"
edition = "2021"
description = "Input action and input mapping assets, their editors, and the input runtime that publishes actions on the Gamma event bus"

[lib]
crate-type = ["cdylib", "rlib"]
name = "input_plugin"

[features]
# Statically linked hosts use the Rust API and must not emit the
# process-global dynamic loader symbols shared by every plugin.
builtin = []
# Poll game controllers (gilrs) from the runtime.
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[dependencies]
gpui-ce = { workspace = true }
ui = { workspace = true }
plugin_editor_api = { workspace = true }
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
pulsar_scenedb = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_events = { workspace = true }
profiling = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
gilrs = { version = "0.11.2", optional = true }

[dev-dependencies]
# Headless rendering of the editors (`gpui::TestAppContext`, `#[gpui::test]`).
gpui-ce = { workspace = true, features = ["test-support"] }
