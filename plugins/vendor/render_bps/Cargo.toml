[package]
name = "render_bps_plugin"
version = "0.1.0"
edition = "2021"
description = "Visual editor for Helio render graphs, built on the Graphy canvas"

[lib]
crate-type = ["cdylib", "rlib"]
name = "render_bps_plugin"

# Built into the editor (feature `builtin`, on in pulsar_engine) it registers at link
# time like the Blueprint editor; without it, it exports the plugin DLL symbols.
# It is its own editor over the shared Graphy canvas and shares nothing with the
# Blueprint editor.

[features]
# Statically linked into the editor: registers through plugin_manager at link time.
builtin = ["dep:plugin_manager"]

[dependencies]
plugin_editor_api = { workspace = true }
plugin_manager = { workspace = true, optional = true }
engine_backend = { workspace = true }
engine_fs = { workspace = true }
wgpu = { workspace = true }
parking_lot = { workspace = true }
gpui-ce = { workspace = true }
ui = { workspace = true }

# The shared graph canvas: document model, layout, drawing, input and the
# profile API this plugin implements.
graphy = { workspace = true }
graphy-render = { path = "../../../crates/third-party/graphy/crates/graphy-render" }
graphy-gpui = { path = "../../../crates/third-party/graphy/crates/graphy-gpui", features = ["gpui"] }

# The render graph asset model, its node registry and compiler.
helio-graph-asset = { workspace = true }
helio-default-passes = { workspace = true }

serde_json = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
