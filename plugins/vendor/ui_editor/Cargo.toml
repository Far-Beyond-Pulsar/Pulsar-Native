[package]
name = "ui_editor_plugin"
version = "0.1.0"
edition = "2021"
description = "Widget assets and the WYSIWYG widget editor for the Pulsar editor"

[lib]
crate-type = ["cdylib", "rlib"]
name = "ui_editor_plugin"

[features]
# Statically linked hosts use the Rust API and must not emit the
# process-global dynamic loader symbols shared by every plugin.
builtin = []

[dependencies]
gpui-ce = { workspace = true }
ui = { workspace = true }
plugin_editor_api = { workspace = true }
ui_common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Headless rendering of the editor (`gpui::TestAppContext`, `#[gpui::test]`).
gpui-ce = { workspace = true, features = ["test-support"] }
