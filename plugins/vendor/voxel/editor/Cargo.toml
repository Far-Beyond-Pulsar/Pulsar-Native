[package]
name = "voxel_plugin"
version = "0.1.0"
edition = "2024"
description = "Voxel worlds (pulsar.voxel): the editor plugin -- its metadata and the voxel terrain's inspector editors, over the plugin's component crate"

[lib]
name = "voxel_plugin"

[features]
# Statically linked hosts (the editor) use the Rust API; the inspector
# editors register through `inventory` once the crate is linked, and the
# component crate (with everything it registers) comes with it.
builtin = []

[dependencies]
voxel_component = { workspace = true }
helio-pass-voxel-planet = { workspace = true }
helio_component = { workspace = true }
plugin_editor_api = { workspace = true }
# The property editors' GPUI-typed prims (as helio-component).
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
ui = { workspace = true }
serde_json = { workspace = true }
# The level editor UI: registrations through its extension points
# (`ui_level_editor::extend`), each naming its origin.
ui_level_editor = { workspace = true }
inventory = { workspace = true }
pulsar_plugins = { workspace = true }
rust-i18n = { workspace = true }
ui_common = { workspace = true }
engine_backend = { workspace = true }
glam = { workspace = true }
pulsar_scenedb = { workspace = true }
tracing = { workspace = true }
profiling = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# The inspector tests (tests/inspector.rs): the shared inspector and a
# headless window.
gpui-ce = { workspace = true, features = ["test-support"] }
ui_common = { workspace = true }
pulsar_reflection = { workspace = true }

[lints]
workspace = true
