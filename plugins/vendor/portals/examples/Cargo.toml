[package]
name = "portals-examples"
version = "0.1.0"
edition = "2021"
publish = false
description = "The portals plugin's standalone hosts on Helio: portal demos"

[features]
# `#[derive(SceneStore)]` (the plugin's rows in `common.rs`) checks the
# deriving crate's own `gpu` feature.
default = ["gpu"]
gpu = []

[[bin]]
name = "portals_demo"
path = "portals_demo.rs"

[[bin]]
name = "infinite_tunnel"
path = "infinite_tunnel.rs"

[[bin]]
name = "portal_cube"
path = "portal_cube.rs"

[[bin]]
name = "portal_rooms"
path = "portal_rooms.rs"

[dependencies]
# `#[derive(SceneStore)]` expands to reflection paths.
pulsar_reflection = { workspace = true }
bytemuck = { workspace = true }
env_logger = "0.11"
glam = { workspace = true }
helio = { workspace = true }
helio-components = { workspace = true }
helio-core = { workspace = true }
helio-feature-api = { workspace = true }
helio-mesh-api = { workspace = true }
helio-pass-forward-lit = { workspace = true }
helio-pass-gbuffer = { workspace = true }
helio-pass-object-batch = { workspace = true }
helio-pass-portal-cull = { workspace = true }
helio-pass-portal-instances = { workspace = true }
helio-presets = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
log = { workspace = true }
pollster = "0.4"
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
scenedb-inspector-agent = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
