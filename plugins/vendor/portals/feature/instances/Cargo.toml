[package]
name = "helio-pass-portal-instances"
version = "0.1.0"
edition = "2021"
description = "Draws portal-duplicated instances (from helio-pass-portal-cull) into the G-buffer, clipped to each portal's opening"

[features]
default = ["gpu"]
gpu = []

[dependencies]
helio-frame-api = { workspace = true }
helio-feature-api = { workspace = true }
helio-core = { workspace = true }
helio-mats = { workspace = true }
helio-pass-portal-cull = { workspace = true }
helio-pass-gbuffer = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
pulsar_scenedb = { workspace = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
