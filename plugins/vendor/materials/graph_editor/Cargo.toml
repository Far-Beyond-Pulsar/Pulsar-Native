[package]
name = "materials_graph_editor"
version = "0.1.0"
edition = "2021"
description = "Materials (pulsar.materials): the material graph editor -- the node canvas, PSGC compilation, live previews and the .material asset's save/load (formerly Plugin_Shaders' shader_editor)"

[lib]
name = "materials_graph_editor"

[[example]]
name = "standalone"
path = "examples/standalone.rs"

[dependencies]
graphy-blueprint = { workspace = true }
# The shared graph canvas: layout, drawing, hit-testing, input and the profile API.
graphy-render = { path = "../../../../crates/third-party/graphy/crates/graphy-render" }
graphy-gpui = { path = "../../../../crates/third-party/graphy/crates/graphy-gpui", features = ["gpui"] }
graphy = { workspace = true }
profiling = { workspace = true }
gpui-ce = { workspace = true }
ui = { workspace = true }

plugin_editor_api = { workspace = true }
ui_common = { workspace = true }
pulsar_reflection = { workspace = true }
engine_state = { workspace = true }
engine_fs = { workspace = true }

# Shader compiler stack
psgc = { workspace = true }
# The materials' one compiler and preview program.
materials_component = { workspace = true }
wgsl_std = { path = "../../../../crates/third-party/psgc/crates/wgsl_std" }

uuid = { workspace = true }
smol = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
image = { workspace = true, features = ["tiff"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
wgpu = { workspace = true }
naga = { version = "30.0.0", features = ["wgsl-in"] }
parking_lot = { workspace = true }
bytemuck = { workspace = true }
tool_registry = { workspace = true }
tool_registry_macros = { workspace = true }
