[package]
name = "helio-mats"
version = "0.1.0"
edition = "2021"
authors = ["Helio Contributors"]
description = "The materials' public contract (pulsar.materials): the GPU material row and table, the material texture table and its binding modes, texture uploads, PBR evaluation and specular AA WGSL, and the Radiant material templates. The one crate another kind reads a material concept from."
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
gpu = []
# The material row as a SceneDB component for standalone hosts
# (`host_rows`): examples and tests enable it; engines produce the rows from
# their own material assets.
host-rows = ["dep:helio-components", "dep:pulsar_scenedb_derive", "dep:pulsar_reflection", "dep:serde_json"]

[dependencies]
helio-core = { workspace = true }
pulsar_scenedb = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
# The scalar surface values and document (`asset`).
serde = { workspace = true, features = ["derive"] }
helio-components = { workspace = true, optional = true }
pulsar_scenedb_derive = { workspace = true, optional = true }
# `#[derive(SceneStore)]` expands to `::serde_json`, `::wgpu` and reflection paths.
pulsar_reflection = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
image = { workspace = true, features = ["png"] }
