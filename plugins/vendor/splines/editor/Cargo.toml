[package]
name = "splines_plugin"
version = "0.1.0"
edition = "2024"
description = "Splines (pulsar.splines): the editor plugin -- its metadata, over the plugin's component crate"

[lib]
name = "splines_plugin"

[features]
# Statically linked hosts (the editor) use the Rust API; the component crate
# (with everything it registers) comes with this crate.
builtin = []

[dependencies]
splines_component = { workspace = true }
plugin_editor_api = { workspace = true }
# The level editor UI: registrations through its extension points
# (`ui_level_editor::extend`), each naming its origin.
ui_level_editor = { workspace = true }
inventory = { workspace = true }
pulsar_plugins = { workspace = true }
rust-i18n = { workspace = true }
gpui-ce = { workspace = true }
ui = { workspace = true }
ui_common = { workspace = true }
glam = { workspace = true }
pulsar_scenedb = { workspace = true }
engine_backend = { workspace = true }
tool_registry = { workspace = true }
tool_registry_macros = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
