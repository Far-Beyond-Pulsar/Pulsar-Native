# The `pulsar.splines` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). The runtime module carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.splines"
name = "Splines"
description = "Authored curves: their component, its methods and the editor lines that show them"
enabled_by_default = true
requires = []

[modules]
# What a game built for the project links.
runtime = ["splines_component"]
# What the editor links in addition.
editor = ["splines_plugin"]
