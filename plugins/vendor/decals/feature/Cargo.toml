[package]
name = "helio-pass-decal"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: decal projection (bullet holes, cracks, stickers)"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
gpu = []

[dependencies]
helio-scene-join = { workspace = true }
helio-frame-api = { workspace = true }
helio-feature-api = { workspace = true }
pulsar_reflection = { workspace = true }
helio-core = { workspace = true }
helio-mats = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
pulsar_scenedb = { workspace = true }

[dev-dependencies]
helio-mats = { workspace = true, features = ["host-rows"] }
helio-mesh-host = { workspace = true }
# The decal drawer over Helio's default graph (tests/joins_with_content.rs).
helio = { workspace = true }
helio-presets = { workspace = true }
helio-components = { workspace = true }
helio-mesh-api = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_reflection = { workspace = true }
glam = { workspace = true }
naga = { version = "30.0.0", features = ["wgsl-in", "glsl-out"] }
pollster = "0.4"
