[package]
name = "decals_component"
version = "0.1.0"
edition = "2024"
description = "Decals (pulsar.decals): the decal component, its rows and the registrations of the plugin's Helio feature"

# Hosts (the editor through the plugin crate, the game) link it; the
# component, its rows, texture binding, scene rows and render feature
# register through `inventory` once the crate is linked.
[lib]
name = "decals_component"

[features]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
default = ["gpu"]
gpu = []

[dependencies]
# The plugin's descriptor and its registrations' origin.
pulsar_plugins = { workspace = true }
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
helio_component = { workspace = true }
# The game's slim feature set (as pulsar_game): linking the plugin must not
# pull the editor's features into a game build. A path dependency because
# the workspace table cannot opt out of default features.
engine_backend = { path = "../../../../crates/core/engine_backend", default-features = false, features = ["render"] }
inventory = { workspace = true }
# The engine-class derive logs through it.
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
wgpu = { workspace = true }
helio = { workspace = true }
helio-feature-api = { workspace = true }
helio-scene-join = { workspace = true }
helio-pass-decal = { workspace = true }

[dev-dependencies]
engine_state = { workspace = true }
image = { workspace = true }
pollster = "=0.4.0"
helio-core = { workspace = true }
glam = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
