# The `pulsar.render_pipelines` plugin's descriptor. A project enables or
# disables it in its Pulsar.toml (`[plugins]`); disabled, its folder
# (`plugins/pulsar.render_pipelines/`) and the old pipeline ids' migration are
# absent (see crates/core/pulsar_plugins), and a level that names one of its
# pipelines says the pipeline was not found.
id = "pulsar.render_pipelines"
name = "Render Pipelines"
description = "The render pipelines the engine ships, as .rendergraph assets made from Helio's presets for the plugins the project enables"
enabled_by_default = true
# None: every kind's passes join the shipped graphs where its feature placed
# them (the frame's slots and draw phases), so an absent kind is simply not in
# the files; nothing here names a kind or links one.
requires = []

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it like the editor.
root = "render_pipelines_plugin"
