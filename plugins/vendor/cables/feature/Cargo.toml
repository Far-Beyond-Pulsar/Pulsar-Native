[package]
name = "helio-pass-cables"
version = "0.1.0"
edition = "2024"
description = "GPU rendering and simulation feature for Pulsar cables"
publish = false

[dependencies]
cables_api = { workspace = true }
helio-core = { workspace = true }
helio-feature-api = { workspace = true }
helio-frame-api = { workspace = true }
pulsar_scenedb = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
helio-mats = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[lints]
workspace = true
