[package]
name = "cables_component"
version = "0.1.0"
edition = "2024"
description = "Cable definition and connector components for pulsar.cables"

[dependencies]
engine_class_derive = { workspace = true }
engine_fs = { workspace = true }
engine_state = { workspace = true }
cables_api = { workspace = true }
pulsar_reflection = { workspace = true }
serde = { workspace = true, features = ["derive"] }
pulsar_world_registry = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
wgpu = { workspace = true }
helio-scene-join = { workspace = true }
helio-core = { workspace = true }
helio-feature-api = { workspace = true }
cables_feature = { workspace = true }
helio_component = { workspace = true }
meshes_component = { workspace = true }
pulsar_scene_model = { workspace = true }
glam = { workspace = true }
# The game's slim feature set (as portals_component): linking the plugin must
# not pull the editor's features into a game build. A path dependency because
# the workspace table cannot opt out of default features.
engine_backend = { path = "../../../../crates/core/engine_backend", default-features = false, features = ["render"] }

[features]
default = ["gpu"]
gpu = []

[lints]
workspace = true
