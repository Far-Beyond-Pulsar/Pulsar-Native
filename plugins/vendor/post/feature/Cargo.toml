[package]
name = "helio-pass-post-volumes"
version = "0.1.0"
edition = "2021"
description = "Post-process volumes as a Helio feature: the camera and volume rows and the pass that blends them into the frame's post settings, which the tone map reads."
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
# `#[derive(SceneStore)]` (`host_rows`) checks the deriving crate's own `gpu` feature.
gpu = []
# Row components for standalone hosts (`host_rows`): examples and tests
# enable it; engines derive the rows from their own components.
host-rows = ["dep:helio-components", "dep:pulsar_scenedb_derive", "dep:serde_json", "dep:pulsar_reflection"]

[dependencies]
helio-components = { workspace = true, optional = true }
pulsar_scenedb_derive = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
pulsar_reflection = { workspace = true, optional = true }
helio-scene-join = { workspace = true }
helio-core = { workspace = true }
helio-feature-api = { workspace = true }
helio-frame-api = { workspace = true }
helio-pass-postprocess = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pulsar_scenedb = { workspace = true }

[dev-dependencies]
pollster = "=0.4.0"
