# The `pulsar.post` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). The runtime module carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.post"
name = "Post-Process Volumes"
description = "Post-process volumes and camera baselines: their components, rows and the renderer feature that blends them into the frame's post settings"
enabled_by_default = true
requires = []

[modules]
# What a game built for the project links.
runtime = ["post_component"]
# What the editor links in addition.
editor = ["post_plugin"]
