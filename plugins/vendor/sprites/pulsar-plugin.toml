# The `pulsar.sprites` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). The runtime module carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.sprites"
name = "Sprites"
description = "2D sprites drawn over the scene: their component, rows, image binding and the renderer feature that culls, batches and draws them"
enabled_by_default = true
requires = []

[modules]
# What a game built for the project links.
runtime = ["sprites_component"]
# What the editor links in addition.
editor = ["sprites_plugin"]
