[package]
name = "helio-pass-deferred-light"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: helio-pass-deferred-light"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
gpu = []
# A row component for standalone hosts (`host_rows`): examples and tests
# enable it; engines derive the rows from their own components.
host-rows = ["dep:helio-components", "dep:pulsar_scenedb_derive", "dep:serde_json"]

[dependencies]
helio-light-api = { workspace = true }
helio-bake-types = { workspace = true }
pulsar_reflection = { workspace = true }
helio-core  = { workspace = true }
helio-mats  = { workspace = true }
helio-feature-api = { workspace = true }
helio-frame-api = { workspace = true }
wgpu      = { workspace = true }
bytemuck  = { workspace = true, features = ["derive"] }
pulsar_scenedb = { workspace = true }
helio-components = { workspace = true, optional = true }
pulsar_scenedb_derive = { workspace = true, optional = true }
# `#[derive(SceneStore)]` expands to `::serde_json`, `::wgpu` and reflection paths.
serde_json = { workspace = true, optional = true }
