[package]
name = "installed_plugins"
version = "0.1.0"
edition = "2021"
publish = false
description = "The installed plugins: every plugin under plugins/vendor that describes itself (pulsar-plugin.toml), by its root crate; with `editor`, the roots' editor registrations and the editor tools. Generated from the descriptors. The editor links it; a project enables its plugins (pulsar_plugins); a game built for a project links only that project's roots."

[dependencies]
pulsar_plugins = { workspace = true }
# BEGIN installed plugins: generated from plugins/vendor/*/pulsar-plugin.toml
# by `UPDATE_INSTALLED_PLUGINS=1 cargo test -p installed_plugins --test installed_set`.
skeletal_animation_plugin = { workspace = true }
asset_viewer_plugin = { workspace = true, optional = true }
blueprint_editor_plugin = { workspace = true, optional = true }
script_editor_plugin = { workspace = true, optional = true }
decals_plugin = { workspace = true }
fog_plugin = { workspace = true }
foliage_plugin = { workspace = true }
gi_plugin = { workspace = true }
input_plugin = { workspace = true }
lens_plugin = { workspace = true }
lights_plugin = { workspace = true }
materials_plugin = { workspace = true }
plugin_matter = { workspace = true, optional = true }
meshes_plugin = { workspace = true }
particles_plugin = { workspace = true }
physics_plugin = { workspace = true }
portals_plugin = { workspace = true }
post_plugin = { workspace = true }
render_bps_plugin = { workspace = true, optional = true }
sky_plugin = { workspace = true }
splines_plugin = { workspace = true }
sprites_plugin = { workspace = true }
editor_table_plugin = { workspace = true, optional = true }
trait_editor_plugin = { workspace = true, optional = true }
plugin_typescript = { workspace = true, optional = true }
ui_editor_plugin = { workspace = true, optional = true }
voxel_plugin = { workspace = true }
water_plugin = { workspace = true }
# END installed plugins

[features]
default = ["editor"]
# The editor plugins: what the editor links in addition to the runtime.
# BEGIN installed plugins: generated from plugins/vendor/*/pulsar-plugin.toml
# by `UPDATE_INSTALLED_PLUGINS=1 cargo test -p installed_plugins --test installed_set`.
editor = [
    "skeletal_animation_plugin/editor",
    "dep:asset_viewer_plugin",
    "dep:blueprint_editor_plugin",
    "dep:script_editor_plugin",
    "decals_plugin/editor",
    "fog_plugin/editor",
    "foliage_plugin/editor",
    "gi_plugin/editor",
    "input_plugin/editor",
    "lens_plugin/editor",
    "lights_plugin/editor",
    "materials_plugin/editor",
    "dep:plugin_matter",
    "meshes_plugin/editor",
    "particles_plugin/editor",
    "physics_plugin/editor",
    "portals_plugin/editor",
    "post_plugin/editor",
    "dep:render_bps_plugin",
    "sky_plugin/editor",
    "splines_plugin/editor",
    "sprites_plugin/editor",
    "dep:editor_table_plugin",
    "dep:trait_editor_plugin",
    "dep:plugin_typescript",
    "dep:ui_editor_plugin",
    "voxel_plugin/editor",
    "water_plugin/editor",
]
# END installed plugins

[dev-dependencies]
toml = { workspace = true }
# The absent-plugins test (tests/absent_plugins.rs): a project's levels,
# registries and renderer, as the editor and the game run them.
engine_backend = { path = "../../crates/core/engine_backend", default-features = false, features = ["render"] }
engine_state = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_settings = { workspace = true }
pulsar_scenedb = { workspace = true }
helio = { workspace = true }
helio-core = { workspace = true }
helio-presets = { workspace = true }
helio-mats = { workspace = true }
helio_component = { workspace = true }
plugin_editor_api = { workspace = true }
# The absent meshes: no model importer, no skinned access.
asset_import = { workspace = true }
wgpu = { workspace = true }
pollster = "1.0"
glam = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
image = { workspace = true }
# The level editor as the editor assembles it (tests/level_editor.rs): the
# shell with every installed plugin's root registering through its
# extension points.
ui_level_editor = { workspace = true }
parking_lot = { workspace = true }
# The plugin catalog's proofs (tests/catalog.rs): the host catalog and a
# fixture plugin whose root registers its component and editor crates' code.
plugin_manager = { workspace = true }
catalog_fixture_plugin = { path = "tests/fixtures/catalog_plugin", features = ["editor"] }
catalog_fixture_component = { path = "tests/fixtures/catalog_plugin/component" }

[lints]
workspace = true
