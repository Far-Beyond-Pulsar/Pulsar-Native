# Rev history (2026-08-15, Pulsar-Native#561 Phase D):
# 43921b0 (this workspace's long-standing pin) -> 697967b (caught up ~114
# commits: SceneDb/the GPU-mirror module) -> 4895d04 (merged origin/
# unified-GPU into SceneDB's main: World::attach_change_tracker/
# SharedChangeTracker -- SceneDB#47's listener-system anchor, actually
# built -- plus the archetype-graph edge cache and Bundle/WorldQuery work
# unified-GPU carried; also adds `Mut::into_inner`, needed by
# `engine_class_derive`'s `get_as_engine_class_mut` shim now that
# `World::get_mut` returns `Mut<'_, T>` instead of `&mut T`) -> 27b5f01
# (variable-length `#[gpu]` fields: a plain `Vec<T: Pod>`-typed `#[gpu]`
# field is now detected by the derive from its Rust type alone -- no new
# attribute syntax -- and routed to a shared, growable `VarLenGpuPool<T>`
# with zero impact on existing fixed-size `#[gpu]` fields; this is what
# lets a component like `StaticMeshComponent` hold its actual mesh
# payload -- `Vec<PackedVertex>`/`Vec<u32>` -- directly as SceneDB fields
# instead of an indirect asset-arena handle) -> 096933a (`VarLenGpuPool::
# read_buffer()`, a `Deref<Target = wgpu::Buffer>` guard alternative to
# `with_buffer`'s closure, for callers needing a real buffer-shaped
# struct field) -> 0d27664 (`DynamicGpuBuffer`/`VarLenGpuPool` gain
# `new_with_usage`, letting a caller request a base buffer usage other
# than the `STORAGE` default -- e.g. `VERTEX`/`INDEX` -- while every
# existing caller, including every `#[gpu] Vec<T>` derive field, keeps
# calling plain `new()` and stays on `STORAGE`, unchanged; this is what
# lets Helio's `MeshPool` delegate its own vertex/index storage straight
# to a `VarLenGpuPool` instead of a second, hand-rolled reimplementation
# of the same grow-and-freelist mechanics). Pushed to
# `origin/main` directly (not a `[patch]` override) -- was briefly a local
# `path` pin while the SceneDB-side merge was still uncommitted; promoted
# back to a real, CI-safe `git`+`rev` once pushed, matching the pattern
# this workspace already uses everywhere else this situation comes up (see
# the `[patch]` block below for the identical `pulsar_reflection` history).
# `features = ["gpu"]` added because the whole `gpu` module is feature-gated
# (CONTRACTS C0: the SceneDB core stays graphics-free without it).
# TEMPORARY: pinned to unmerged branch `engineclass-json-roundtrip`
# (Far-Beyond-Pulsar/Pulsar-Reflection#5, EngineClass::to_json +
# REGISTRY.create_instance_from_json). Move back to main once merged --
# tracked on Far-Beyond-Pulsar/Pulsar-Native#560, same pattern as the other
# temporary pins there.
pulsar_reflection                  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "b0d9b957b00e695d005df4ab18becf82b377b740" }
