ui               = { path = "crates/ui/wgpui-component/crates/ui" }
ui-macros        = { path = "crates/ui/wgpui-component/crates/ui-macros" }
pulsar_std        = { path = "crates/core/pulsar_std" }
plugin_editor_api = { path = "crates/core/plugin_editor_api" }
ui_common         = { path = "crates/editor/ui_common" }
ui_auth           = { path = "crates/editor/ui_auth" }
engine_backend    = { path = "crates/core/engine_backend" }
engine_state      = { path = "crates/core/engine_state" }
ui_types_common   = { path = "crates/editor/ui_types_common" }
pulsar_std_bundle = { path = "crates/core/pulsar_std_bundle" }
pulsar_bp_executor = { path = "crates/core/pulsar_bp_executor" }
# Point at the same unified source as the Pulsar-Reflection patch below so every
# `pulsar_reflection` reference (whichever repo/rev it came from) collapses to a
# single copy. Uses the double-slash URL alias (see that patch for why).
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar//Pulsar-Reflection", rev = "b0d9b957b00e695d005df4ab18becf82b377b740" }
pulsar_reflection_derive = { git = "https://github.com/Far-Beyond-Pulsar//Pulsar-Reflection", rev = "b0d9b957b00e695d005df4ab18becf82b377b740" }

