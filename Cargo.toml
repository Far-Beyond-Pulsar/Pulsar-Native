render_bps_plugin = { path = "plugins/vendor/render_bps", features = ["builtin"] }
script_editor_plugin = { path = "plugins/vendor/code_editor", features = ["builtin"] }
skeletal_animation_plugin = { path = "plugins/vendor/skm_editor" }
skeletal_animation_editor = { path = "plugins/vendor/skm_editor/editor", features = ["builtin"] }
ui_editor_plugin = { path = "plugins/vendor/ui_editor", features = ["builtin"] }
# Every installed plugin's modules (runtime; `editor` adds the editor
# plugins). Hosts link the set, never a plugin by name.
installed_plugins                  = { path = "plugins/installed", default-features = false }
engine_state                       = { path = "crates/core/engine_state" }
engine_subsystems                  = { path = "crates/subsystems/engine_subsystems" }
pulsar_auth                        = { path = "crates/core/pulsar_auth" }
pulsar_settings                    = { path = "crates/core/pulsar_settings" }
engine_backend                     = { path = "crates/core/engine_backend" }
pulsar_lsp                         = { path = "crates/core/pulsar_lsp" }
window_manager                     = { path = "crates/core/window_manager" }
pulsar_game                        = { path = "crates/core/pulsar_game" }
pulsar_core                        = { path = "crates/core/pulsar_core" }
pulsar_pie_abi                     = { path = "crates/core/pulsar_pie_abi" }
pulsar_scenedb                     = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241", features = ["gpu"] }
pulsar_scenedb_derive               = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241" }
