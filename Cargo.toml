[workspace]
# Crates inside plugin repositories (the submodules under plugins/vendor) are
# named one by one, never by a glob: Pulsar chooses which of a plugin's crates
# join its workspace (CI's vendor-member guard).
members = [
    "crates/profiling",
    # The Blueprint plugin's graph -> script module compiler.
    "plugins/vendor/blueprint_editor/compiler",
    # The editor-tool plugins in their own repositories (Blueprints, the code,
    # matter and table editors): members like every plugin crate, built
    # against this workspace's crates (Pulsar-Native#1605).
    "plugins/vendor/blueprint_editor",
    "plugins/vendor/code_editor",
    "plugins/vendor/matter_editor",
    "plugins/vendor/table_editor",
    # Visual editor for Helio render graphs; reuses the Blueprint editor through
    # its profile API. A plugin DLL: never link it into a binary that embeds the
    # Blueprint editor (they would share one profile).
    "plugins/vendor/render_bps",
    # The trait asset editor (`pulsar.trait_editor`) and TypeScript scripting
    # (`pulsar.typescript`): in-tree editor-tool plugins.
    "plugins/vendor/trait_editor",
    "plugins/vendor/typescript",
    "crates/core/*",
    "crates/editor/*",
    "crates/subsystems/*",
    "crates/agent-providers/*",
    "crates/ui/wgpui-base",
    "plugins/vendor/asset_viewer",
    # Skeletal animation editor; built-in plugin of the editor.
    "plugins/vendor/skm_editor",
    # The skeletal asset formats, shared by that plugin and the asset importer.
    "plugins/vendor/skm_editor/skeletal_assets",
    "plugins/vendor/skm_editor/component",
    "plugins/vendor/skm_editor/editor",
    # Physics (`pulsar.physics`): its root crate, and its api (the .physasset schema).
    "plugins/vendor/physics_plugin",
    "plugins/vendor/physics_plugin/api",
    # Widget assets (.widget) and the WYSIWYG widget editor; built-in plugin of the editor.
    "plugins/vendor/ui_editor",
    # Input actions (.inputaction), input mappings (.inputmap), and the input
    # runtime that publishes them on the event bus; built-in plugin of the editor.
    "plugins/vendor/input_plugin",
    # Voxel worlds (`pulsar.voxel`): the plugin's crates -- api (contracts),
    # world (the GPU-free world system), feature (its Helio feature), component
    # (components, methods, runtime, file formats), editor (the editor plugin)
    # and examples (its standalone hosts: voxel_craft, voxel_flight,
    # water_world). Built-in plugin of the editor and the game.
    "plugins/vendor/voxel",
    "plugins/vendor/voxel/api",
    "plugins/vendor/voxel/world",
    "plugins/vendor/voxel/feature",
    "plugins/vendor/voxel/component",
    "plugins/vendor/voxel/editor",
    "plugins/vendor/voxel/examples",
    # The leaf object kinds' plugins (layered rewrite phase B, batch 1): each
    # has a component crate (components, methods, rows, registrations), its
    # feature crates (the Helio passes it brought from the Helio repo), an
    # editor crate (the editor plugin) and, when it has demos, an examples
    # crate. Built-in plugins of the editor and the game.
    "plugins/vendor/particles",
    "plugins/vendor/particles/component",
    "plugins/vendor/particles/feature",
    "plugins/vendor/particles/examples",
    "tools/todo_check",
    "plugins/vendor/sprites",
    "plugins/vendor/sprites/component",
    "plugins/vendor/sprites/feature/*",
    "plugins/vendor/sprites/editor",
    "plugins/vendor/sprites/examples",
    "plugins/vendor/decals",
    "plugins/vendor/decals/component",
    "plugins/vendor/decals/feature",
    "plugins/vendor/decals/examples",
    "plugins/vendor/lens",
    "plugins/vendor/lens/component",
    "plugins/vendor/lens/feature/flare",
    "plugins/vendor/lens/feature/lens",
    "plugins/vendor/lens/feature/optics",
    "plugins/vendor/lens/examples",
    "plugins/vendor/portals",
    "plugins/vendor/portals/component",
    "plugins/vendor/portals/feature/cull",
    "plugins/vendor/portals/feature/instances",
    "plugins/vendor/portals/editor",
    "plugins/vendor/portals/examples",
    "plugins/vendor/splines",
    "plugins/vendor/splines/component",
    "plugins/vendor/splines/editor",
    # The media and placement kinds' plugins (phase B, batch 2), the same
    # way; water and foliage also have an api crate (contracts other
    # plugins read: the terrain seam and hitbox rows, the wind rows).
    "plugins/vendor/character",
    "plugins/vendor/fog",
    "plugins/vendor/fog/component",
    "plugins/vendor/fog/feature",
    "plugins/vendor/fog/editor",
    "plugins/vendor/fog/examples",
    "plugins/vendor/post",
    "plugins/vendor/post/component",
    "plugins/vendor/post/feature",
    "plugins/vendor/post/editor",
    "plugins/vendor/post/examples",
    "plugins/vendor/water",
    "plugins/vendor/water/api",
    "plugins/vendor/water/component",
    "plugins/vendor/water/feature",
    "plugins/vendor/water/editor",
    "plugins/vendor/water/examples",
    "plugins/vendor/foliage",
    "plugins/vendor/foliage/api",
    "plugins/vendor/foliage/component",
    "plugins/vendor/foliage/feature/gbuffer",
    "plugins/vendor/foliage/feature/place",
    "plugins/vendor/foliage/editor",
    "plugins/vendor/foliage/examples",
    # The lighting plugins (phase B, batch 3): GI (its api crate is the
    # probes' contract the voxel terrain traces; no SceneDB component, its
    # component crate holds its registrations) and the sky (atmosphere and
    # clouds; what others read of it is the frame's).
    "plugins/vendor/gi",
    "plugins/vendor/gi/api",
    "plugins/vendor/gi/feature",
    "plugins/vendor/gi/examples",
    "plugins/vendor/sky",
    "plugins/vendor/sky/component",
    "plugins/vendor/sky/feature",
    "plugins/vendor/sky/editor",
    "plugins/vendor/sky/examples",
    # The meshes (phase B, batch 4): every mesh crate that left Helio (api,
    # the feature's batch, culling, drawers and virtual geometry, the VG
    # asset crates, asset import), the standalone hosts' components and
    # demos, the component crate (the feature's registrations) and the
    # editor crate.
    "plugins/vendor/meshes",
    "plugins/vendor/meshes/api",
    "plugins/vendor/meshes/feature/forward",
    "plugins/vendor/meshes/feature/gbuffer",
    "plugins/vendor/meshes/feature/indirect-dispatch",
    "plugins/vendor/meshes/feature/object-batch",
    "plugins/vendor/meshes/feature/occlusion-cull",
    "plugins/vendor/meshes/feature/shadow",
    "plugins/vendor/meshes/feature/shadow-dirty",
    "plugins/vendor/meshes/feature/transparent",
    "plugins/vendor/meshes/feature/vg",
    "plugins/vendor/meshes/feature/vg-bvh",
    "plugins/vendor/meshes/feature/vg-cull",
    "plugins/vendor/meshes/feature/vg-dense",
    "plugins/vendor/meshes/feature/vg-raster",
    "plugins/vendor/meshes/feature/vg-shade",
    "plugins/vendor/meshes/vg/build",
    "plugins/vendor/meshes/vg/format",
    "plugins/vendor/meshes/vg/stream",
    "plugins/vendor/meshes/asset-compat",
    "plugins/vendor/meshes/host",
    "plugins/vendor/meshes/snapshot",
    "plugins/vendor/meshes/web-demos",
    "plugins/vendor/meshes/android-demos",
    "plugins/vendor/meshes/component",
    "plugins/vendor/meshes/editor",
    "plugins/vendor/meshes/examples",
    # The lights (phase B, batch 5): the api (the light list, binning,
    # shadow views and their WGSL), the feature's crates (binning, shadow
    # views, deferred lighting, light-field shading, billboards), the
    # standalone hosts' features and rows, the component crate (Light,
    # ReflectionCapture, the registrations), the editor crate and examples.
    "plugins/vendor/materials",
    "plugins/vendor/materials/api",
    "plugins/vendor/materials/feature",
    "plugins/vendor/materials/component",
    "plugins/vendor/materials/editor",
    "plugins/vendor/materials/graph_editor",
    "plugins/vendor/lights",
    "plugins/vendor/lights/api",
    "plugins/vendor/lights/feature/billboard",
    "plugins/vendor/lights/feature/cull",
    "plugins/vendor/lights/feature/deferred",
    "plugins/vendor/lights/feature/hlfs",
    "plugins/vendor/lights/feature/shadows",
    "plugins/vendor/lights/host",
    "plugins/vendor/lights/component",
    "plugins/vendor/lights/editor",
    "plugins/vendor/lights/examples",
    # The installed plugins (Phase C step 2): every plugin under
    # plugins/vendor with a pulsar-plugin.toml, generated from those
    # descriptors. The editor links it; a project enables its plugins
    # (`pulsar_plugins`); a game links only its project's.
    "plugins/installed",
    # The plugin catalog's fixture plugin (plugins/installed/tests/catalog.rs).
    "plugins/installed/tests/fixtures/catalog_plugin",
    "plugins/installed/tests/fixtures/catalog_plugin/component",
    "plugins/installed/tests/fixtures/catalog_plugin/editor",
    # The trait proof's fixture plugin (plugins/installed/tests/traits.rs).
    "plugins/installed/tests/fixtures/trait_plugin",
    # Fixtures for plugin_manager's world-component plugin tests (#1083):
    # members so they build against this workspace's patched SceneDB and
    # Pulsar-Reflection, as editor plugins do.
    "crates/core/plugin_manager/tests/fixtures/world_plugins/host",
    "crates/core/plugin_manager/tests/fixtures/world_plugins/static_plugin",
    # Plugins with dependencies on each other, for plugin_manager's load-order tests.
    "crates/core/plugin_manager/tests/fixtures/dependency_plugins/base",
    "crates/core/plugin_manager/tests/fixtures/dependency_plugins/top",
    "crates/core/plugin_manager/tests/fixtures/dependency_plugins/orphan",
]

# External plugin repositories are linked into `ui_core` as libraries, but own
# their standalone applications and repository-level validation independently.
# Without an explicit boundary Cargo auto-enrolls these path dependencies as
# workspace members and `cargo test --all` races their identically named
# `standalone` examples into the same output file.
exclude = [
    # Graphy is its own Cargo workspace (core + graphy-blueprint, tested there);
    # this workspace consumes its crates as path dependencies.
    "crates/third-party/graphy",
    "crates/core/plugin_manager/tests/fixtures/plugin_loader_fixture",
    "crates/core/pulsar_script_vm/tests/fixtures/test_library",
    "crates/core/pulsar_events/tests/fixtures/plugin",
    # WGPUI is an independently versioned repository. Pulsar consumes it as a
    # path dependency, but its standalone examples/dev dependencies must remain
    # owned and resolved by WGPUI rather than polluting Pulsar's workspace graph.
    "crates/ui/wgpui",
    "crates/renderer/helio",
]

default-members = ["crates/core/engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anomalyco/Pulsar-Native"
rust-version = "1.81"
authors = ["Tristan J. Poland"]
homepage = "https://github.com/anomalyco/Pulsar-Native"
keywords = ["game-engine", "editor"]

###################################
# Profiles
###################################

[profile.release]
# The commented-out hardening keys below were deliberate anti-RE choices, but
# panic="abort" also removes catch_unwind fault isolation, so they stay off
# until that tradeoff is revisited deliberately.
# debug = false
# strip = "symbols"
# lto = "fat"
# panic = "abort"
# lto = "thin"
# codegen-units = 1

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
# Voxel terrain residency, ray casts and world builds run on the CPU every
# frame; unoptimized they would misrepresent the editor viewport.
helio-pass-voxel-planet = { opt-level = 3 }
helio-voxel-world = { opt-level = 3 }
# The lens pass's bundled prescriptions are traced at renderer start-up
# (about 2 s unoptimized, under 1 s optimized; see helio-pass-lens `bundled`).
helio-lens-optics = { opt-level = 3 }
# The virtual-geometry cluster-DAG builder runs on worker threads when a mesh
# first gets a VirtualGeometryComponent; unoptimized it takes minutes.
helio-vg-build = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
# The renderer itself and every editor panel built on it -- excluded from
# this list until now, but they're exactly the "hot, rarely what you're
# actually debugging" case this override list exists for (see the four
# entries above): scene/quad batching, layout-tree diffing, and every
# panel's own per-frame render() all run through these two crates on every
# single frame. At the workspace default of opt-level 0, that's commonly a
# 10-20x slowdown over release for CPU-bound Rust -- easily the difference
# between "30-40fps" and "hundreds" on its own, before any actual
# algorithmic issue. `gpui-ce` is excluded from `[workspace] members`
# (it's WGPUI's own independently-versioned repo, see that exclude's own
# comment) but that only affects auto-target-discovery, not which profile
# applies to it when built as a path dependency of this workspace's own
# binaries -- it still gets *this* Cargo.toml's `[profile.dev.package]`
# table like any other dependency in the graph.
gpui-ce = { opt-level = 3 }
ui = { opt-level = 3 }
# Path tessellation (`gpui::PathBuilder`, backed by lyon): every icon/SVG
# already went through this, and the profiler's newly-added smooth-curve
# charts (`ui::profiler::record::overview`) now do too.
lyon = { opt-level = 3 }

###################################
# Workspace Dependencies
###################################

[workspace.dependencies]
owo-colors = "4"

# ---------- GPUI (vendored) ----------
gpui-ce      = { path = "crates/ui/wgpui", features = ["inspector", "flamegraph"] }
wgpui-base   = { path = "crates/ui/wgpui-base" }
ui           = { path = "crates/ui/wgpui-component/crates/ui", features = ["inspector", "flamegraph", "tree-sitter-languages", "chat-components"] }
ui-macros    = { path = "crates/ui/wgpui-component/crates/ui-macros" }

# ---------- Core Engine ----------
# Profiling - instrumentation-based
profiling                          = { path = "crates/profiling", default-features = false }
crossbeam-queue                    = "0.3"
arc-swap                           = "1.9"
# Tracy frontend: crates.io `profiling` v1, kept separate from the custom
# collector above so both can coexist. Because gpui-ce depends on the same
# crates.io package, enabling any crate's tracy feature feature-unifies the
# whole graph onto one backend, lighting up every `profiling::scope!` in
# wgpui as well.
profiling-v1                       = { package = "profiling", version = "1", default-features = false }
engine_fs                          = { path = "crates/core/engine_fs", default-features = false }
pulsar_traits                      = { path = "crates/core/pulsar_traits" }
editor_task_queue                  = { path = "crates/core/editor_task_queue" }
asset_import                       = { path = "crates/core/asset_import" }
skeletal_assets                    = { path = "plugins/vendor/skm_editor/skeletal_assets" }
animation_component                = { path = "plugins/vendor/skm_editor/component" }
# The object kinds' plugins. Each plugin's root crate (`<kind>_plugin`, the
# package at the plugin's directory) is the one place it registers what it
# contributes; hosts reach a plugin only through its root, by the installed
# set (`plugins/installed`) or a generated game. The voxel plugin
# (`pulsar.voxel`): its root, component and editor crates here; its other
# crates are below, with the Helio crates.
voxel_component                    = { path = "plugins/vendor/voxel/component" }
voxel_plugin                       = { path = "plugins/vendor/voxel" }
voxel_editor                       = { path = "plugins/vendor/voxel/editor" }
# The leaf kinds' plugins, the same way (their feature crates are below).
particles_component                = { path = "plugins/vendor/particles/component" }
particles_plugin                   = { path = "plugins/vendor/particles" }
sprites_component                  = { path = "plugins/vendor/sprites/component" }
sprites_plugin                     = { path = "plugins/vendor/sprites" }
sprites_editor                     = { path = "plugins/vendor/sprites/editor" }
decals_component                   = { path = "plugins/vendor/decals/component" }
decals_plugin                      = { path = "plugins/vendor/decals" }
lens_component                     = { path = "plugins/vendor/lens/component" }
lens_plugin                        = { path = "plugins/vendor/lens" }
portals_component                  = { path = "plugins/vendor/portals/component" }
portals_plugin                     = { path = "plugins/vendor/portals" }
portals_editor                     = { path = "plugins/vendor/portals/editor" }
splines_component                  = { path = "plugins/vendor/splines/component" }
splines_plugin                     = { path = "plugins/vendor/splines" }
splines_editor                     = { path = "plugins/vendor/splines/editor" }
# The media and placement kinds' plugins, the same way.
fog_component                      = { path = "plugins/vendor/fog/component" }
character_plugin                   = { path = "plugins/vendor/character" }
fog_plugin                         = { path = "plugins/vendor/fog" }
fog_editor                         = { path = "plugins/vendor/fog/editor" }
post_component                     = { path = "plugins/vendor/post/component" }
post_plugin                        = { path = "plugins/vendor/post" }
post_editor                        = { path = "plugins/vendor/post/editor" }
water_component                    = { path = "plugins/vendor/water/component" }
water_plugin                       = { path = "plugins/vendor/water" }
water_editor                       = { path = "plugins/vendor/water/editor" }
foliage_component                  = { path = "plugins/vendor/foliage/component" }
foliage_plugin                     = { path = "plugins/vendor/foliage" }
foliage_editor                     = { path = "plugins/vendor/foliage/editor" }
# The lighting plugins, the same way.
gi_plugin                          = { path = "plugins/vendor/gi" }
sky_component                      = { path = "plugins/vendor/sky/component" }
sky_plugin                         = { path = "plugins/vendor/sky" }
sky_editor                         = { path = "plugins/vendor/sky/editor" }
meshes_component                   = { path = "plugins/vendor/meshes/component" }
meshes_plugin                      = { path = "plugins/vendor/meshes" }
meshes_editor                      = { path = "plugins/vendor/meshes/editor" }
materials_component                = { path = "plugins/vendor/materials/component" }
materials_plugin                   = { path = "plugins/vendor/materials" }
materials_editor                   = { path = "plugins/vendor/materials/editor" }
lights_component                   = { path = "plugins/vendor/lights/component" }
lights_plugin                      = { path = "plugins/vendor/lights" }
lights_editor                      = { path = "plugins/vendor/lights/editor" }
pulsar_std                         = { path = "crates/core/pulsar_std" }
pulsar_plugins                     = { path = "crates/core/pulsar_plugins" }
# Plugins whose crate is the plugin (the editor tools and the pre-rewrite
# plugins), linked by the installed set (plugins/installed). `builtin` drops
# the dynamic-loader exports a plugin library carries for a DLL build.
asset_viewer_plugin = { path = "plugins/vendor/asset_viewer", features = ["builtin"] }
blueprint_editor_plugin = { path = "plugins/vendor/blueprint_editor", features = ["builtin"] }
editor_table_plugin = { path = "plugins/vendor/table_editor" }
