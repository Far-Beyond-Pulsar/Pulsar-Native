###################################
# Clippy Lints
###################################

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
# File IO goes through `engine_fs` (the root clippy.toml lists the methods;
# architecture/std-fs-allowed.txt the files allowed to touch the disk).
disallowed_methods = "deny"
let_underscore_future = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
manual_is_multiple_of = "allow"
type_complexity = "allow"
todo = "deny"
style = { level = "allow", priority = -1 }

###################################
# Typos
###################################

[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

###################################
# Patch: redirect external git deps
# to local vendored copies so Cargo
# resolves a single copy in-tree.
#
# External deps (plugin repos,
# Graphy, etc.) reference Pulsar-Native
# crates via git. Without patching,
# Cargo compiles duplicate copies.
###################################

[patch."https://github.com/Far-Beyond-Pulsar/WGPUI"]
gpui-ce = { path = "crates/ui/wgpui" }

# Helio's wgpu: the upstream v30.0.1 tag plus Helio's patches, on our fork's
# helio/v30.0.1 branch (texture tracker start states, which put HiZ mips in
# the wrong Vulkan layout; handles compared by instance and id). Patches only
# apply from the root manifest, so this mirrors Helio's own
# `[patch.crates-io]`; patching the whole wgpu workspace keeps naga and
# wgpu-types a single version. Change it together with Helio's.
[patch.crates-io]
naga = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core-deps-apple = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core-deps-emscripten = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-hal = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-naga-bridge = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-types = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }

[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Native"]
# The plugins pin Pulsar-Native by git rev, and those revs carry their own
# `pulsar_reflection`; resolve them to the one Pulsar-Reflection rev (#844).
pulsar_reflection = { path = "crates/external/pulsar-reflection/crates/pulsar_reflection" }
pulsar_reflection_derive = { path = "crates/external/pulsar-reflection/crates/pulsar_reflection_derive" }
gpui-ce           = { path = "crates/ui/wgpui" }
ui                = { path = "crates/ui/wgpui-component/crates/ui" }
ui-macros         = { path = "crates/ui/wgpui-component/crates/ui-macros" }
pulsar_std        = { path = "crates/core/pulsar_std" }
plugin_editor_api = { path = "crates/core/plugin_editor_api" }
ui_common         = { path = "crates/editor/ui_common" }
ui_auth           = { path = "crates/editor/ui_auth" }
engine_backend    = { path = "crates/core/engine_backend" }
engine_state      = { path = "crates/core/engine_state" }
ui_types_common   = { path = "crates/editor/ui_types_common" }
pulsar_script_vm  = { path = "crates/core/pulsar_script_vm" }
pulsar_script_codegen = { path = "crates/core/pulsar_script_codegen" }
engine_fs         = { path = "crates/core/engine_fs" }
plugin_manager    = { path = "crates/core/plugin_manager" }
pulsar_plugins    = { path = "crates/core/pulsar_plugins" }
pulsar_class      = { path = "crates/core/pulsar_class" }
pulsar_script_runtime = { path = "crates/core/pulsar_script_runtime" }
# The flamegraph reads ONE global profiler. Helio pins `profiling` from this
# repo by git rev; without this patch helio-core links a second copy with its
# own private `PROFILER` static, so every render-graph pass scope was recorded
# into a profiler nobody drains.
profiling         = { path = "crates/profiling" }

# SceneDB depends on the standalone Pulsar-Profiling repo (the fork's origin).
# Same problem as above: unpatched, its scopes never reach the flamegraph.
[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Profiling"]
profiling = { path = "crates/profiling" }

[patch."https://github.com/Far-Beyond-Pulsar/Graphy"]
graphy = { path = "crates/third-party/graphy" }

[patch."https://github.com/Far-Beyond-Pulsar/PulsarConfig"]
pulsar-config = { path = "crates/third-party/pulsar-config" }

[patch."https://github.com/Far-Beyond-Pulsar/WGPUI-Component"]
ui = { path = "crates/ui/wgpui-component/crates/ui" }
ui-macros = { path = "crates/ui/wgpui-component/crates/ui-macros" }

[patch."https://github.com/Far-Beyond-Pulsar/ToolbeltRS"]
tool_registry = { path = "crates/third-party/toolbelt/crates/tool_registry" }
tool_registry_macros = { path = "crates/third-party/toolbelt/crates/tool_registry_macros" }

[patch."https://github.com/Far-Beyond-Pulsar/PSGC"]
psgc = { path = "crates/third-party/psgc/crates/psgc" }
wgsl_std = { path = "crates/third-party/psgc/crates/wgsl_std" }

# Pulsar-Reflection is a plain git dependency (Pulsar-Native#844): the root pins
# above name the rev, and every other copy in the graph -- SceneDB's and
# Helio's own pins, the plugins' -- is patched onto it so the reflection types
# keep a single identity. Bump by changing the pins and the three revs below
# together. The `//` URL spelling is what lets a patch point at a different rev
# of the "same" source.
[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection"]
pulsar_reflection = { path = "crates/external/pulsar-reflection/crates/pulsar_reflection" }
pulsar_reflection_derive = { path = "crates/external/pulsar-reflection/crates/pulsar_reflection_derive" }
pulsar_reflection_codegen = { path = "crates/external/pulsar-reflection/crates/pulsar_reflection_codegen" }
# SceneDB: Pulsar, Helio and the plugins pin it by git rev; every copy in the
# graph resolves to the one rev Pulsar names (the `//` URL spelling lets a
# patch point at a different rev of the same repository), so SceneDB's types
# are one set of types for all of them.
[patch."https://github.com/Far-Beyond-Pulsar/SceneDB"]
pulsar_scenedb = { git = "https://github.com//Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241" }
pulsar_scenedb_derive = { git = "https://github.com//Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241" }
