# Suites that create a wgpu device per test crash with STATUS_ACCESS_VIOLATION
# on some Windows drivers when two run at once (Pulsar-Native#1647). The suites
# take an in-process lock for plain `cargo test`; nextest runs each test in its
# own process, so this group (one test at a time across all of them) is what
# serializes them here. A new suite that creates its own device joins the
# filter below. (Helio is its own workspace and has its own .config/nextest.toml.)
[test-groups]
gpu-device = { max-threads = 1 }

[[profile.default.overrides]]
filter = """
(package(helio-pass-sky) & binary(sky_gpu))
| (package(helio-pass-voxel-planet) & binary(voxel_pass_graph))
"""
test-group = "gpu-device"

# Hosted CI runners have no GPU: wgpu falls back to lavapipe (Mesa's CPU
# Vulkan). The `ci` profile leaves out, by name, the test binaries that render
# real frames or need a real adapter, rather than letting them count as passed:
#
# - meshes_component's GPU mirror and content-dedup suites need an adapter and
#   panic without one (Pulsar-Native#1036);
# - the voxel planet's chunk, cloud, volume, foliage and pass-graph suites, GI's
#   probe tracers, the level editor's render acceptance and dense VG suites and
#   the game's render-parity tests render full frames: on lavapipe they take
#   1-7 minutes each and most die with SIGSEGV inside the driver (the p16 run
#   lost ~90 tests that way and hit the step's 60-minute limit); the chunk
#   bit-identity tests also bind 147 MB terrain tables, past lavapipe's 128 MB
#   storage binding limit;
# - one level-editor test saves a level with the renderer's voxel chunks.
#
# Everything else (the CPU tests of the same crates included) still runs. Run
# the GPU suites on a GPU machine: `cargo test -p <package> --test <binary>`.
[profile.ci]
default-filter = """
not (
    (package(meshes_component) & (
        binary(static_mesh_component_gpu_mirror)
        | binary(content_dedup)
        | binary(content_dedup_benchmarks)
    ))
    | (package(helio-pass-voxel-planet) & (
        binary(chunks)
        | binary(clouds)
        | binary(volumes)
        | binary(foliage_on_voxels)
        | binary(voxel_pass_graph)
    ))
    | (package(helio-pass-gi) & (binary(gi_tests) | binary(mesh_tests)))
    | (package(ui_level_editor) & (
        binary(render_acceptance)
        | binary(virtual_geometry_dense_acceptance)
    ))
    | (package(pulsar_game) & (
        binary(voxel_render_parity)
        | (binary(runtime_render_parity) & test(=every_runtime_renders_the_same_level))
    ))
    | (package(installed_plugins) & binary(level_editor)
        & test(=a_level_save_keeps_the_renderers_voxel_chunks))
)
"""

# A test that hangs must not hold a runner. On 2026-10-13 a single physics_plugin
# render test sat for 18,260 s (>5 h) on a hosted runner until the run was
# cancelled by hand. Flag any test over a minute as SLOW and kill it after ten.
# The job-level timeout in ci.yml is the backstop; this one fails the hung test
# by name so the cause is visible instead of an opaque cancelled job.
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "10s" }
