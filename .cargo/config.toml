[target.x86_64-pc-windows-msvc]
# (`prefer-dynamic` and the library search paths for every platform are the `cfg` tables below.)
rustflags = ["-C", "link-arg=/STACK:8000000", "-C", "link-args=/FORCE:MULTIPLE"]

# Every platform links `std` and the shared libraries dynamically. Flags of the matching
# `target.<triple>` and `target.<cfg>` tables are joined.
[target.'cfg(not(target_family = "wasm"))']
rustflags = ["-C", "prefer-dynamic"]

# The shared libraries sit beside the editor executable; a plugin library sits two folders below it
# (plugins/editor), so each searches its own folder and the executable's.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN", "-C", "link-arg=-Wl,-rpath,$ORIGIN/../.."]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path", "-C", "link-arg=-Wl,-rpath,@loader_path/../.."]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-Wl,--allow-multiple-definition"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-Wl,--allow-multiple-definition"]

[target.armv7-unknown-linux-gnueabihf]
rustflags = ["-C", "link-args=-Wl,--allow-multiple-definition"]

[target.i686-unknown-linux-gnu]
rustflags = ["-C", "link-args=-Wl,--allow-multiple-definition"]

[build]
jobs = 4
# No incremental compilation data. Cargo keeps a per-crate incremental cache under target/*/incremental
# that grows with every rebuild; with this off, rebuilding writes the same artifact files over again.
# The cost is that a rebuild after an edit recompiles the whole edited crate (measured on one test
# binary: 41 to 61 s with incremental, 163 s without). Set CARGO_INCREMENTAL=1 for a one-off session.
incremental = false

[alias]
set-logo = "run --manifest-path tools/set-logo/Cargo.toml --"

[env]
AWS_LC_SYS_NO_PREFIX = "1"
AWS_LC_SYS_CMAKE_BUILDER = "0"
AWS_LC_SYS_C_STD = "c11"
CMAKE_C_STANDARD = "11"

[target.aarch64-apple-darwin.env]
CFLAGS = "-std=c11"
CMAKE_C_FLAGS = "-std=c11"
PKG_CONFIG_PATH = "/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/zlib/lib/pkgconfig:/usr/local/lib/pkgconfig"

[target.x86_64-apple-darwin.env]
CFLAGS = "-std=c11"
CMAKE_C_FLAGS = "-std=c11"
PKG_CONFIG_PATH = "/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/zlib/lib/pkgconfig:/usr/local/lib/pkgconfig"
