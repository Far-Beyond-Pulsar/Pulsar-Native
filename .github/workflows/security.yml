name: Security

# Kept out of ci.yml on purpose: advisories appear on their own schedule, not
# when a commit lands, so running an audit per commit mostly re-reports the
# same finding. Pull requests only get the checks that depend on their diff.

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # New or changed dependencies on a pull request: known-vulnerable versions
  # and disallowed licenses are rejected before they merge.
  dependency-review:
    name: dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # RustSec advisories against the lockfile. Vulnerabilities fail the run;
  # unmaintained/yanked notices are reported but do not.
  audit:
    name: cargo audit
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        run: cargo audit
