name: CI

# Cost model
#   Pull requests : the Linux lane only (fmt, clippy, guards, tests, packaging
#                   smoke test). Draft PRs are skipped until marked ready, a
#                   new push cancels the run it supersedes, and docs-only
#                   changes skip CI entirely.
#   main / nightly: additionally compile-check Windows and macOS and run the
#                   packaging smoke test there. Trigger it by hand on any
#                   branch with `gh workflow run CI --ref <branch> -f full=true`.
# Branch pushes do not run CI on their own (the pull request covers them), and
# tags are handled by release.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".github/FUNDING.yml"
      - "LICENSE*"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".github/FUNDING.yml"
      - "LICENSE*"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Also run the Windows and macOS lanes
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUSTFLAGS: ""
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # Fast, dependency-free gate: fails in seconds, before any compile minutes
  # are spent.
  fmt:
    name: rustfmt
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Workflow files are code: lint them so a typo fails here, not at 3am.
  workflows:
    name: workflow lint
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color \
            -shellcheck= -pyflakes= \
            .github/workflows/ci.yml .github/workflows/security.yml

  # The one full build-and-test lane. Every PR gets this; nothing else is
  # replicated per platform.
  linux:
    name: build, lint and test (linux)
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libglib2.0-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxkbcommon-x11-0 libxkbcommon-x11-dev libasound2-dev libudev-dev \
            clang libclang-dev \
            mesa-vulkan-drivers

      # clippy is a superset of `cargo check`, so it replaces it here: one
      # compile of the workspace instead of two. The allow-list is the one the
      # release gate has always used.
      - name: clippy (includes cargo check)
        run: |
          cargo clippy --workspace --exclude pulsar_docs --all-targets -- \
            -A warnings \
            -A dead_code \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::match_like_matches_macro \
            -A clippy::only_used_in_recursion \
            -A improper_ctypes_definitions \
            -A clippy::field_reassign_with_default \
            -A clippy::result_large_err \
            -A clippy::doc_overindented_list_items

      # The Blueprint editor is a plugin: the editor must still build, and its
      # shell must not have grown a dependency back, without it.
      - name: Editor builds without the Blueprint plugin
        run: cargo check -p pulsar_engine --no-default-features

      - name: Validate workspace dependency modes
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --format-version 1 | ConvertFrom-Json -AsHashtable

          function Get-ResolvedPackage([string] $name, [string] $version = "") {
            $packages = @($metadata["packages"] | Where-Object {
              $_["name"] -eq $name -and (!$version -or $_["version"] -eq $version)
            })
            if ($packages.Count -ne 1) {
              throw "Expected exactly one resolved $name $version package; found $($packages.Count)"
            }

            $packageId = $packages[0]["id"]
            $nodes = @($metadata["resolve"]["nodes"] | Where-Object { $_["id"] -eq $packageId })
            if ($nodes.Count -ne 1) {
              throw "Expected exactly one resolve node for $name $version; found $($nodes.Count)"
            }
            return $nodes[0]
          }

          # Pulsar installs Ring explicitly for its Rustls users. A
          # default-enabled reqwest edge silently adds AWS-LC to every
          # workspace test binary (native-tls remains intentional for rustup).
          $reqwest = Get-ResolvedPackage "reqwest" "0.13.4"
          $forbiddenTlsFeatures = @(
            "default",
            "default-tls",
            "rustls",
            "__rustls-aws-lc-rs"
          )
          $enabledForbiddenTlsFeatures = @(
            $forbiddenTlsFeatures | Where-Object { $reqwest["features"] -contains $_ }
          )
          if ($enabledForbiddenTlsFeatures.Count -ne 0) {
            throw "reqwest 0.13.4 violates the Ring/no-provider policy: $($enabledForbiddenTlsFeatures -join ', ')"
          }
          $awsLcPackages = @($metadata["packages"] | Where-Object {
            $_["name"] -in @("aws-lc-rs", "aws-lc-sys")
          })
          if ($awsLcPackages.Count -ne 0) {
            throw "AWS-LC unexpectedly resolved into the workspace; use the explicit provider policy"
          }

          # jsonwebtoken 10 panics on first use when neither backend is
          # selected. Relay JWTs use the pure-Rust provider so the provider is
          # deterministic without reintroducing AWS-LC.
          $jsonwebtoken = Get-ResolvedPackage "jsonwebtoken" "10.4.0"
          if ($jsonwebtoken["features"] -notcontains "rust_crypto") {
            throw "jsonwebtoken 10.4.0 has no RustCrypto provider"
          }
          if ($jsonwebtoken["features"] -contains "aws_lc_rs") {
            throw "jsonwebtoken 10.4.0 unexpectedly enables AWS-LC"
          }

          # Static built-ins use Rust APIs directly. They must not emit the
          # process-global dynamic loader ABI shared by every plugin.
          foreach ($plugin in @(
            "blueprint_editor_plugin",
            "script_editor_plugin",
            "asset_viewer_plugin",
            "skeletal_animation_plugin",
            "physics_plugin",
            "ui_editor_plugin",
            "input_plugin"
          )) {
            $node = Get-ResolvedPackage $plugin
            if ($node["features"] -notcontains "builtin") {
              throw "$plugin is statically embedded without its builtin feature"
            }
          }

          # Pulsar owns the built-in library integrations, while external plugin
          # repositories own their standalone applications. Letting Cargo
          # auto-enroll those repositories as workspace members makes their
          # identically named examples race for target/*/examples/standalone.
          $workspaceMemberIds = @($metadata["workspace_members"])
          $vendorWorkspaceMembers = @(
            $metadata["packages"] | Where-Object {
              $workspaceMemberIds -contains $_["id"] -and
              (($_["manifest_path"] -replace "\\", "/") -match "/plugins/vendor/")
            } | ForEach-Object { $_["name"] } | Sort-Object
          )
          # These two are explicit root-workspace members: the built-in asset
          # viewer, and the GPUI-free Blueprint compiler and graph model tested
          # against Pulsar's VM.
          $expectedVendorWorkspaceMembers = @("asset_viewer_plugin", "blueprint_compiler", "blueprint_graph", "physics_plugin", "skeletal_animation_plugin", "skeletal_assets", "ui_editor_plugin", "input_plugin")
          $workspaceMemberDifference = @(
            Compare-Object $expectedVendorWorkspaceMembers $vendorWorkspaceMembers
          )
          if ($workspaceMemberDifference.Count -ne 0) {
            throw "External plugin apps leaked into the Pulsar workspace: $($vendorWorkspaceMembers -join ', ')"
          }

          $uiCorePackages = @($metadata["packages"] | Where-Object {
            $_["name"] -eq "ui_core"
          })
          if ($uiCorePackages.Count -ne 1) {
            throw "Expected exactly one ui_core package; found $($uiCorePackages.Count)"
          }
          $uiCoreDependencies = @(
            $uiCorePackages[0]["dependencies"] | ForEach-Object { $_["name"] }
          )
          $expectedBuiltins = @(
            "asset_viewer_plugin",
            "editor_table_plugin",
            "input_plugin",
            "physics_plugin",
            "plugin_matter",
            "script_editor_plugin",
            "shader_editor_plugin",
            "skeletal_animation_plugin",
            "ui_editor_plugin"
          )
          $missingBuiltins = @(
            $expectedBuiltins | Where-Object { $uiCoreDependencies -notcontains $_ }
          )
          if ($missingBuiltins.Count -ne 0) {
            throw "ui_core lost built-in plugin integrations: $($missingBuiltins -join ', ')"
          }

          # Scripting languages are plugins on equal footing: the editor shell
          # must not link any of them. The Blueprint editor registers itself
          # at link time (plugin_manager::LinkedEditorProvider) and is part of
          # a build through pulsar_engine's `blueprint` feature.
          foreach ($language in @("blueprint_editor_plugin", "blueprint_compiler")) {
            if ($uiCoreDependencies -contains $language) {
              throw "ui_core depends on $language; scripting languages must stay plugins"
            }
          }

      - name: Resolve Pulsar's pinned SceneDB source
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --format-version 1 | ConvertFrom-Json -AsHashtable
          $packages = @($metadata["packages"] | Where-Object { $_["name"] -eq "pulsar_scenedb" })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one pulsar_scenedb package in locked Cargo metadata; found $($packages.Count)"
          }

          $manifest = $packages[0]["manifest_path"] -replace "\\", "/"
          $directory = (Split-Path -Parent $packages[0]["manifest_path"]) -replace "\\", "/"
          $targetDirectory = (Join-Path $env:GITHUB_WORKSPACE "target") -replace "\\", "/"
          "SCENEDB_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCENEDB_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCENEDB_TARGET_DIR=$targetDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: SceneDB graphics-free core guard (CONTRACTS C0)
        shell: bash
        run: cargo check --manifest-path "$SCENEDB_MANIFEST" --target-dir "$SCENEDB_TARGET_DIR" -p pulsar_scenedb --no-default-features

      - name: SceneDB no-Helio edge guard (CONTRACTS C0)
        shell: bash
        run: |
          set -e
          # Capture first so a cargo-tree failure fails the step (grep on a
          # pipeline sees empty input and would silently pass — fail-open).
          tree="$(cargo tree --manifest-path "$SCENEDB_MANIFEST" -p pulsar_scenedb -e normal)"
          if grep -qi helio <<< "$tree"; then echo "C0 violation: pulsar_scenedb depends on Helio"; exit 1; fi
          # Feature-blind gap (M3-a final review F1): a gpu-feature-gated Helio
          # edge would evade the featureless tree above — check it too.
          tree_gpu="$(cargo tree --manifest-path "$SCENEDB_MANIFEST" -p pulsar_scenedb --features gpu -e normal)"
          if grep -qi helio <<< "$tree_gpu"; then echo "C0 violation: pulsar_scenedb (--features gpu) depends on Helio"; exit 1; fi

      - name: SceneDB no-GPUI/fork-wgpu edge guard (M3-a T2)
        shell: bash
        run: |
          set -e
          # `pulsar_reflection`'s `gpui-ce`/`ui` deps (gated behind its own
          # `prims-gpui` feature, not requested by pulsar_scenedb) pull the
          # workspace's git-forked wgpu transitively (gpui-ce's lib is named
          # `gpui`). SceneDB is on upstream wgpu 30 and must never carry
          # either edge. Tree captured first: fail-closed if cargo tree errors.
          tree="$(cargo tree --manifest-path "$SCENEDB_MANIFEST" -p pulsar_scenedb --features gpu -e normal)"
          if grep -iE "gpui|wgpui" <<< "$tree"; then
            echo "M3-a T2 violation: pulsar_scenedb (--features gpu) depends on gpui/wgpui"
            exit 1
          fi
          if grep -i "wgpu" <<< "$tree" | grep -i "http"; then
            echo "M3-a T2 violation: pulsar_scenedb (--features gpu) wgpu edge is git-sourced, not registry wgpu 30"
            exit 1
          fi

      - name: SceneDB resolves outside the workspace (submodule-build precondition)
        shell: bash
        run: |
          set -e
          scratch="${RUNNER_TEMP}/scenedb-resolve-check"
          rm -rf "$scratch"
          mkdir -p "$scratch/src"
          touch "$scratch/src/lib.rs"
          cat > "$scratch/Cargo.toml" <<EOF
          [package]
          name = "scenedb-resolve-check"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          pulsar_scenedb = { path = "${SCENEDB_DIR}", features = ["gpu"] }

          [workspace]
          EOF
          cd "$scratch"
          cargo metadata --format-version 1 > /dev/null

      - name: SceneDB Test 3 byte-layout gate (CONTRACTS C5)
        shell: bash
        run: cargo test --manifest-path "$SCENEDB_MANIFEST" --target-dir "$SCENEDB_TARGET_DIR" -p pulsar_scenedb --features gpu --test gpu_layout

      - name: SceneDB gpu-gated lib tests (Test 11 et al., no adapter needed)
        shell: bash
        run: cargo test --manifest-path "$SCENEDB_MANIFEST" --target-dir "$SCENEDB_TARGET_DIR" -p pulsar_scenedb --features gpu --lib

      # Compile-only: benches are the one gpu-gated target the test matrix
      # never builds (M3-a T1 review caught an unmigrated bench this way).
      - name: SceneDB gpu-gated benches compile guard
        shell: bash
        run: cargo check --manifest-path "$SCENEDB_MANIFEST" --target-dir "$SCENEDB_TARGET_DIR" -p pulsar_scenedb --features gpu --benches

      # A prebuilt binary: compiling nextest from source cost minutes per run.
      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest

      - name: Run tests
        run: cargo nextest run --profile ci --all --no-fail-fast

  # Windows and macOS: compile only, no tests. Runs on main, nightly and by
  # hand, never per pull request: a Windows or macOS minute costs 2x or 10x a
  # Linux minute, and a break caught on main or overnight is cheap to fix.
  cross-platform:
    name: cargo check (${{ matrix.target }})
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.full) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            run_on: macos-latest
          - target: x86_64-windows-msvc
            run_on: windows-latest
    runs-on: ${{ matrix.run_on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: cargo check
        run: cargo check --workspace --exclude pulsar_docs --all-targets

  # Packaging (#926, #889): package the smoke-test project, copy it away from
  # the source tree, run it headless for a few frames and check that
  # begin_play, a runtime spawn and an event handler ran, from game.pak and
  # from loose files. Linux on every pull request; every supported platform on
  # main, nightly and by hand.
  package-smoke:
    name: packaging smoke test (${{ matrix.run_on }})
    if: ${{ github.event.pull_request.draft != true }}
    strategy:
      fail-fast: false
      matrix:
        run_on: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.full)) && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.run_on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install Linux system dependencies
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libglib2.0-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxkbcommon-x11-0 libxkbcommon-x11-dev libasound2-dev libudev-dev \
            clang libclang-dev \
            mesa-vulkan-drivers

      # Script VM pieces packaged games rely on: binary modules, limits,
      # checked arithmetic, capabilities.
      - name: Script VM and runtime tests
        run: cargo test -p pulsar_script_vm -p pulsar_script_runtime -p pulsar_content

      # Package (pak and --loose), copy to a clean directory, delete the
      # project, run headless through pulsar_game::standalone (the generated
      # main's code path) and check the report and the log.
      - name: Packaging smoke test
        run: cargo test -p pulsar_package --no-default-features --test smoke -- --nocapture

      # The `pulsar` CLI on the same project (content only; a release build
      # of a generated game is the drift check's job).
      - name: pulsar package (CLI)
        shell: bash
        run: |
          cargo run -p pulsar_package --no-default-features --bin pulsar -- package \
            --project crates/core/pulsar_package/tests/fixtures/smoke_project \
            --out "${RUNNER_TEMP}/smoke-package" --profile shipping --skip-build \
            --report "${RUNNER_TEMP}/smoke-package/report.json"
          test -f "${RUNNER_TEMP}/smoke-package/Content/game.pak"

      # Headless Blueprint compile (#879) through the plugin's
      # ScriptLanguage::compile_project.
      - name: Blueprint headless compile
        run: cargo test -p pulsar_package --test blueprint_compile

      # #889: the generated project (main.rs now calls
      # pulsar_game::standalone::run) must still compile against the pins.
      - name: Generated project compiles
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        run: cargo test -p pulsar_game --test generated_project_compiles -- --ignored

  # The plugins pin Pulsar-Native crates by git rev (#847): every pin must be a
  # commit this repository already contains, so standalone plugin builds can
  # fetch it. Fix with `just bump-plugin-pins`.
  plugin-pins:
    name: plugin pins are ancestors of HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Check plugin pins
        run: scripts/plugin-pins.sh check

  # Every submodule must pin a commit on its upstream default branch, so main
  # never depends on a dependency's feature branch. Merge the dependency PR
  # first, re-pin to its main, then merge here; pins still waiting on an
  # upstream PR are listed in .github/submodule-pin-exceptions.txt.
  submodule-pins:
    name: submodule pins are on upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The script reads the pins from the HEAD tree and fetches each
      # upstream's commit graph itself, so the submodules need not be checked
      # out (or deep).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check submodule pins
        run: scripts/submodule-pins.sh check
